      <div class="card empty-card">
        <h3>${t('no_staff_groups_yet')}</h3>
        <p class="muted">${t('add_team_once')}</p>
        <button class="btn btn-primary" onclick="openStaffGroupModal()">${t('add_staff_group_btn')}</button>
      </div>` : `
      ${groups.map(g => groupCardHtml(g)).join('')}

      <div class="card group-card">
        <div class="group-card-head" onclick="toggleGroupExpanded('__ungrouped__')">
          <div><b>${t('ungrouped')}</b><span class="muted">${ungrouped.length} ${t('employees_count')}</span></div>
          <span class="group-chevron">${ui.expandedGroups && ui.expandedGroups['__ungrouped__']?'▾':'▸'}</span>
        </div>
        ${ui.expandedGroups && ui.expandedGroups['__ungrouped__'] ? `
        <div class="group-card-body">

function toggleGroupExpanded(groupId) {

}
function groupCardHtml(g) {

        <span class="group-chevron" onclick="toggleGroupExpanded('${g.id}')">${expanded?'▾':'▸'}</span>

        ${shifts.map(s=>`<div class="card shift-card">
          <div class="shift-card-top">
            <span class="shift-dot" style="background:${s.color}"></span><b>${esc(s.name)}</b>
            <span class="shift-card-actions">
              <a href="#" onclick="openShiftModal('${s.id}');return false;" title="${t('edit')}">${icon('edit')}</a>
              <a href="#" onclick="deleteShift('${s.id}');return false;" title="${t('delete')}" class="col-hdr-danger">✕</a>
            </span>
          </div>
          <div class="muted">${s.start}–${s.end}</div>
          <div class="muted">${t('requires')} ${s.required} ${t('employees_lc')}</div>
        </div>`).join('')}
      </div>
      <button class="link-btn" onclick="openShiftModal(null,'${g.id}')">${t('add_shift_to_group')}</button>

        <div><label>${t('workday_distribution')}</label>
          <select onchange="setGroupField('${g.id}','distribution',this.value)">

            <option value="consecutive" ${g.distribution==='consecutive'?'selected':''}>${t('dist_consecutive')}</option>

        <div><label>${t('target_shifts_per_employee')}</label>
          <input type="number" min="0" value="${g.targetShiftsPerEmployee||''}" onchange="setGroupField('${g.id}','targetShiftsPerEmployee',this.value?Number(this.value):null)"/>

function teamEmpRowHtml(e, groupsInDept) {
  return `<div class="team-emp-row">
    <div><b>${esc(e.name)}</b><span class="muted">${(e.tags||[]).join(', ')||'—'}</span></div>
    <div class="row-actions">
      <button class="link-btn" onclick="openExceptionModal('${e.id}')">${t('exceptions')}</button>
      <button class="link-btn" onclick="openEmployeeModal('${e.id}')">${t('edit')}</button>

        <option value="">${t('move_to_group')}</option>

      </select>
      <button class="link-btn link-danger" onclick="deleteEmployee('${e.id}')">${t('delete')}</button>
    </div>

}
function setGroupField(groupId, field, value) {
  const g = state.staffGroups.find(x=>x.id===groupId);
  if (!g) return;
  g[field] = value;
  saveState();
}
function moveEmployeeToGroup(empId, groupId) {
  if (!groupId) return;
  const e = state.employees.find(x=>x.id===empId);
  if (e) e.staffGroupId = groupId;
  saveState(); render();
}
function openStaffGroupModal(id) {

  ui.modalHtml = `<div class="modal-backdrop" onclick="closeModalBg(event)"><div class="modal">

    <div id="group-modal-error" class="auth-error"></div>

      <button class="btn btn-primary" onclick="saveStaffGroup()">${t('save')}</button>
    </div>
  </div></div>`;

}
function saveStaffGroup() {
  const draft = ui.groupModalDraft;
  const err = document.getElementById('group-modal-error');
  const name = draft.name.trim();
  if (!name) { err.textContent = t('group_name'); return; }
  const id = ui.groupModalEditId;
  if (id) {
    const g = state.staffGroups.find(x=>x.id===id);
    g.name = name; g.displayName = draft.displayName.trim() || name;
  } else {
    const deptId = ui.wizard ? ui.wizard.deptId : ui.activeDeptId;
    const order = state.staffGroups.filter(g=>g.deptId===deptId).length;
    state.staffGroups.push({ id: uid('sgrp'), deptId, name, displayName: draft.displayName.trim() || name,
      sortOrder: order, distribution: 'flexible', consecutiveDays: null, targetShiftsPerEmployee: null });
  }
  closeModal(); saveState(); toast(t('save'));
  render();
}
function deleteStaffGroup(id) {
  const empCount = state.employees.filter(e=>e.staffGroupId===id).length;
  const shiftCount = state.shiftTypes.filter(s=>s.staffGroupId===id).length;
  const msg = isRTL()
    ? `حذف هذي المجموعة؟ ${empCount} موظف و${shiftCount} وردية بتصير بدون مجموعة.`
    : `Delete this group? ${empCount} employees and ${shiftCount} shifts will become ungrouped.`;
  if (!confirm(msg)) return;
  state.staffGroups = state.staffGroups.filter(g=>g.id!==id);
  saveState(); render();
}

function saveEmployee(id) {
  const name = document.getElementById('m-emp-name').value.trim();
  if (!name) { toast(t('please_enter_name')); return; }
  const tags = document.getElementById('m-emp-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const groupEl = document.getElementById('m-emp-group');
  const data = {
    name, tags,
    staffGroupId: groupEl ? groupEl.value : (ui.employeeModal ? ui.employeeModal.staffGroupId : null),
    maxShiftsPerMonth: Number(document.getElementById('m-emp-maxshifts').value) || 20,
    maxHoursPerMonth: Number(document.getElementById('m-emp-maxhours').value) || 200,
    maxConsecutiveDays: Number(document.getElementById('m-emp-maxconsec').value) || 5,
    canMorning: document.getElementById('m-emp-morning').checked,
    canEvening: document.getElementById('m-emp-evening').checked,
    canNight: document.getElementById('m-emp-night').checked,
    canWeekend: document.getElementById('m-emp-weekend').checked,
  };
  if (id) {
    Object.assign(state.employees.find(x=>x.id===id), data);
  } else {
    state.employees.push({ id: uid('emp'), deptId: (ui.wizard ? ui.wizard.deptId : ui.activeDeptId), status: 'active', ...data });
  }
  closeModal(); saveState(); toast(t('employee_saved')); go(ui.wizard ? 'wizard' : ui.route);
}
function toggleEmpStatus(id) {
  const e = state.employees.find(x=>x.id===id);
  e.status = e.status === 'active' ? 'inactive' : 'active';
  saveState(); render();
}
function deleteEmployee(id) {
  if (!confirm(isRTL()?'حذف هذا الموظف؟ لا يمكن التراجع عن هذا الإجراء.':'Delete this employee? This cannot be undone.')) return;
  state.employees = state.employees.filter(x=>x.id!==id);
  saveState(); render();
}

        <div><label>${t('sg_minimum')}</label><input id="m-shift-minimum" type="number" min="0" value="${draft.minimum}" oninput="ui.shiftModalDraft.minimum=Number(this.value)||0"/></div>
      </div>
      <div id="shift-modal-error" class="auth-error"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
        <button class="btn btn-primary" onclick="saveShift()">${t('save')}</button>
      </div>
    </div></div>`;
  render();
}
function saveShift() {
  const draft = ui.shiftModalDraft;
  const id = ui.shiftModalEditId;
  const err = document.getElementById('shift-modal-error');
  const name = draft.name.trim();
  if (!name) { err.textContent = t('please_enter_shift_name'); return; }
  if (!draft.start || !draft.end) { err.textContent = t('sg_err_times'); return; }
  const required = Math.max(0, draft.required || 0);
  const minimum = Math.max(0, draft.minimum || 0);
  if (required < 1) { err.textContent = t('sg_err_required_min1'); return; }
  if (minimum > required) { err.textContent = t('sg_err_min_exceeds_required'); return; }
  if (!draft.staffGroupId) { err.textContent = t('sg_err_no_group'); return; }
  const data = { name, period: draft.period, start: draft.start, end: draft.end, color: draft.color, required, minimum, staffGroupId: draft.staffGroupId };
  if (id) Object.assign(state.shiftTypes.find(x=>x.id===id), data);
  else state.shiftTypes.push({ id: uid('shift'), deptId: (ui.wizard ? ui.wizard.deptId : ui.activeDeptId), ...data });
  closeModal(); saveState(); toast(t('shift_type_saved'));
  go(ui.wizard ? 'wizard' : ui.route);
}
function deleteShift(id) {
  if (!confirm(isRTL()?'حذف نوع الوردية هذا؟':'Delete this shift type?')) return;
  state.shiftTypes = state.shiftTypes.filter(x=>x.id!==id);
  saveState();
  if (ui.route === 'wizard') renderWizardStep(); else render();
}
function autoColorShifts(deptId) {
  const palette = ['#5B6B7C','#0F9E97','#14375E','#7C5CFC','#B9821B','#C6483C','#2E86AB','#8E6C88','#3E8E41','#B5541A'];
  const shifts = state.shiftTypes.filter(s=>s.deptId===deptId);
  shifts.forEach((s,i) => { s.color = palette[i % palette.length]; });
  saveState();
  toast(isRTL() ? 'تم تلوين الورديات تلقائيًا' : 'Shift colors auto-assigned');
  render();
}

/* ---------------- WIZARD ---------------- */
function startWizard() {
  if (!state.departments.length) { openDeptModal(); return; }
  const dept = state.departments.find(d=>d.id===ui.activeDeptId) || state.departments[0];
  const now = new Date();
  let month = now.getMonth()+2, year = now.getFullYear();
  if (month > 12) { month = 1; year++; }
  const defaults = state.departmentDefaults[dept.id];
  ui.wizard = {
    step: 1, deptId: dept.id, month, year,
    employeeIds: state.employees.filter(e=>e.deptId===dept.id && e.status==='active').map(e=>e.id),
    rules: defaults ? JSON.parse(JSON.stringify(defaults.rules)) : defaultRules(),
    weeklyHours: defaults ? { ...defaults.weeklyHours } : defaultWeeklyHours(),
    workWeekStart: defaults ? defaults.workWeekStart : (state.org.workWeekStart || 0),
  };
  ui.wizardLeaveAdding = false;
  go('wizard');
}
function w_useDeptDefaults() {
  const d = state.departmentDefaults[ui.wizard.deptId];
  if (!d) return;
  ui.wizard.weeklyHours = { ...d.weeklyHours };
  ui.wizard.workWeekStart = d.workWeekStart;
  ui.wizard.rules = JSON.parse(JSON.stringify(d.rules));
  toast('Department defaults applied');
  renderWizardStep();
}
function w_copyPreviousMonth() {
  const prior = state.schedules.filter(s=>s.deptId===ui.wizard.deptId).sort((a,b)=>(b.year-a.year)||(b.month-a.month))[0];
  if (!prior) { toast('No previous schedule found for this department'); return; }
  ui.wizard.weeklyHours = { ...(prior.weeklyHours || defaultWeeklyHours()) };
  ui.wizard.workWeekStart = prior.workWeekStart ?? 0;
  ui.wizard.rules = JSON.parse(JSON.stringify(prior.rules));
  toast('Copied shift & rule settings from ' + MONTH_NAMES[prior.month-1] + ' ' + prior.year + ' (leave & holidays not copied)');
  renderWizardStep();
}

function cancelWizard() {

function addLeaveRecord() {
  const empId = document.getElementById('lv-emp').value;
  const type = document.getElementById('lv-type').value;
  const otherLabel = document.getElementById('lv-other').value.trim();
  const startD = document.getElementById('lv-start').value;
  const endD = document.getElementById('lv-end').value;
  const notes = document.getElementById('lv-notes').value.trim();
  if (!empId || !startD || !endD) { toast(t('please_choose_emp_dates')); return; }
  if (endD < startD) { toast(t('end_before_start')); return; }
  const rec = { id: uid('leave'), empId, type, otherLabel, start: startD, end: endD, notes };
  state.leaveRecords.push(rec);
  applyLeaveRecord(state, rec, false);
  saveState();
  toast(t('add_leave_btn'));
  if (ui.route === 'wizard') renderWizardStep(); else render();
}
function removeLeaveRecord(id) {
  const rec = state.leaveRecords.find(r => r.id === id);
  if (!rec) return;
  applyLeaveRecord(state, rec, true);
  state.leaveRecords = state.leaveRecords.filter(r => r.id !== id);
  saveState();
  if (ui.route === 'wizard') renderWizardStep(); else render();
}

function addHoliday() {
  const nameSel = document.getElementById('hol-name').value;
  const name = nameSel === 'other' ? (document.getElementById('hol-other').value.trim() || 'Holiday') : nameSel;
  const startD = document.getElementById('hol-start').value;
  const endD = document.getElementById('hol-end').value;
  const staffing = document.getElementById('hol-staffing').value;
  if (!startD || !endD) { toast('Please choose dates'); return; }
  if (endD < startD) { toast('End date must be on or after the start date'); return; }
  const deptId = ui.wizard ? ui.wizard.deptId : ui.activeDeptId;
  state.holidays.push({ id: uid('hol'), deptId, name, start: startD, end: endD, staffing });
  saveState();
  toast('Holiday added');
  if (ui.route === 'wizard') renderWizardStep(); else render();
}
function removeHoliday(id) {
  state.holidays = state.holidays.filter(h => h.id !== id);
  saveState();
  if (ui.route === 'wizard') renderWizardStep(); else render();
}

/* ---------- STEP: Employee Exceptions ---------- */
function ensureERules(empId) { if (!state.employeeRules[empId]) state.employeeRules[empId] = {}; return state.employeeRules[empId]; }
function summarizeExceptions(empId) {
  const r = state.employeeRules[empId] || {};
  const chips = [];
  (r.mustWork||[]).forEach((mw,i) => {
    const shiftSuffix = mw.shiftId ? ` · ${state.shiftTypes.find(s=>s.id===mw.shiftId)?.name||''}` : '';
    chips.push({ label: `${t('ex_chip_mustwork')} ${mw.date}${shiftSuffix}`, remove: () => { r.mustWork.splice(i,1); } });
  });
  if (r.targetShiftsOverride != null) chips.push({ label: t('ex_chip_target').replace('{n}', r.targetShiftsOverride), remove: () => delete r.targetShiftsOverride });
  if (r.consecutiveShiftTarget != null) chips.push({ label: t('ex_chip_consecrun').replace('{n}', r.consecutiveShiftTarget), remove: () => delete r.consecutiveShiftTarget });
  if (r.minShiftsOverride != null) chips.push({ label: t('ex_chip_min').replace('{n}', r.minShiftsOverride), remove: () => delete r.minShiftsOverride });
  if (r.maxShiftsOverride != null) chips.push({ label: t('ex_chip_max').replace('{n}', r.maxShiftsOverride), remove: () => delete r.maxShiftsOverride });
  if (r.maxConsecutiveOverride != null) chips.push({ label: t('ex_chip_maxconsec').replace('{n}', r.maxConsecutiveOverride), remove: () => delete r.maxConsecutiveOverride });
  if (r.weeklyHoursOverride) chips.push({ label: t('ex_chip_weekly').replace('{n}', r.weeklyHoursOverride.limit).replace('{type}', r.weeklyHoursOverride.type === 'hard' ? t('ex_f_hard_limit') : t('ex_f_target')), remove: () => delete r.weeklyHoursOverride });
  (r.forbiddenShiftTypes||[]).forEach(sid => chips.push({ label: t('ex_chip_cannot').replace('{shift}', state.shiftTypes.find(s=>s.id===sid)?.name||sid), remove: () => { r.forbiddenShiftTypes = r.forbiddenShiftTypes.filter(x=>x!==sid); } }));
  (r.onlyShiftTypes||[]).forEach(sid => chips.push({ label: t('ex_chip_only').replace('{shift}', state.shiftTypes.find(s=>s.id===sid)?.name||sid), remove: () => { r.onlyShiftTypes = r.onlyShiftTypes.filter(x=>x!==sid); } }));
  Object.entries(r.shiftTypeLimits||{}).forEach(([sid,max]) => chips.push({ label: t('ex_chip_shiftmax').replace('{n}', max).replace('{shift}', state.shiftTypes.find(s=>s.id===sid)?.name||sid), remove: () => delete r.shiftTypeLimits[sid] }));
  Object.entries(r.shiftTypeTargets||{}).forEach(([sid,tgt]) => chips.push({ label: t('ex_chip_shifttarget').replace('{n}', tgt).replace('{shift}', state.shiftTypes.find(s=>s.id===sid)?.name||sid), remove: () => delete r.shiftTypeTargets[sid] }));
  return chips;
}

  else if (type === 'shift_target') html = `<label>${t('ex_f_shift_type')}</label><select id="ex-shift">${shiftOptions}</select><label>${t('ex_f_target_count')}</label><input id="ex-num" type="number" min="0"/>`;
  else if (type === 'cannot_work_shift') html = `<label>${t('ex_f_shift_type')}</label><select id="ex-shift">${shiftOptions}</select>`;
  else if (type === 'only_shift') html = `<label>${t('ex_f_shift_type')}</label><select id="ex-shift">${shiftOptions}</select>`;
  else if (type === 'max_consecutive') html = `<label>${t('ex_f_max_consecutive')}</label><input id="ex-num" type="number" min="1"/>`;
  else if (type === 'weekly_hours') html = `<label>${t('ex_f_weekly_limit')}</label><input id="ex-num" type="number" min="1"/>
    <label>${t('rule_type')}</label><select id="ex-hourtype"><option value="hard">${t('ex_f_hard_limit')}</option><option value="soft">${t('ex_f_target')}</option></select>`;
  el.innerHTML = html;

function saveException(empId) {
  const type = document.getElementById('ex-type').value;
  const r = ensureERules(empId);
  if (type === 'do_not_schedule') {
    const datesRaw = document.getElementById('ex-dates').value.trim();
    const weekday = document.getElementById('ex-weekday').value;
    if (datesRaw) datesRaw.split(',').map(s=>s.trim()).filter(Boolean).forEach(d => setAvailability(state, empId, d, 'unavailable'));
    if (weekday !== '') { if (!state.recurringOff[empId]) state.recurringOff[empId] = {}; state.recurringOff[empId][Number(weekday)] = 'unavailable'; }
  } else if (type === 'must_work') {
    const date = document.getElementById('ex-date').value;
    const shiftId = document.getElementById('ex-shift').value || null;
    if (!date) { toast('Please choose a date'); return; }
    r.mustWork = r.mustWork || [];
    r.mustWork.push({ date, shiftId });
  } else if (type === 'prefer_off') {
    const weekday = Number(document.getElementById('ex-weekday').value);
    if (!state.recurringOff[empId]) state.recurringOff[empId] = {};
    state.recurringOff[empId][weekday] = 'prefer_off';
  } else if (type === 'prefer_working') {
    const date = document.getElementById('ex-date').value;
    if (!date) { toast('Please choose a date'); return; }
    setAvailability(state, empId, date, 'prefer_working');
  } else if (type === 'target_shifts') {
    r.targetShiftsOverride = Number(document.getElementById('ex-num').value) || 0;
  } else if (type === 'consecutive_run') {
    r.consecutiveShiftTarget = Number(document.getElementById('ex-num').value) || 0;
  } else if (type === 'min_shifts') {
    r.minShiftsOverride = Number(document.getElementById('ex-num').value) || 0;
  } else if (type === 'max_shifts') {
    r.maxShiftsOverride = Number(document.getElementById('ex-num').value) || 0;
  } else if (type === 'shift_limit') {
    const sid = document.getElementById('ex-shift').value;
    r.shiftTypeLimits = r.shiftTypeLimits || {};
    r.shiftTypeLimits[sid] = Number(document.getElementById('ex-num').value) || 0;
  } else if (type === 'shift_target') {
    const sid = document.getElementById('ex-shift').value;
    r.shiftTypeTargets = r.shiftTypeTargets || {};
    r.shiftTypeTargets[sid] = Number(document.getElementById('ex-num').value) || 0;
  } else if (type === 'cannot_work_shift') {
    const sid = document.getElementById('ex-shift').value;
    r.forbiddenShiftTypes = r.forbiddenShiftTypes || [];
    if (!r.forbiddenShiftTypes.includes(sid)) r.forbiddenShiftTypes.push(sid);
  } else if (type === 'only_shift') {
    const sid = document.getElementById('ex-shift').value;
    r.onlyShiftTypes = r.onlyShiftTypes || [];
    if (!r.onlyShiftTypes.includes(sid)) r.onlyShiftTypes.push(sid);
  } else if (type === 'max_consecutive') {
    r.maxConsecutiveOverride = Number(document.getElementById('ex-num').value) || undefined;
  } else if (type === 'weekly_hours') {
    r.weeklyHoursOverride = { limit: Number(document.getElementById('ex-num').value) || 48, type: document.getElementById('ex-hourtype').value };
  }
  saveState();
  closeModal();
  toast('Exception saved');
}

function w_toggleDay1(el, shiftId, empId) {

}
function wizardReviewStep(w, dept) {
  const shifts = state.shiftTypes.filter(s=>s.deptId===w.deptId);
  const nDays = daysInMonth(w.year, w.month);
  const start = dateKey(w.year, w.month, 1), end = dateKey(w.year, w.month, nDays);
  const leaveRecords = state.leaveRecords.filter(r => w.employeeIds.includes(r.empId) && r.start <= end && r.end >= start);
  const holidays = state.holidays.filter(h => h.deptId === w.deptId && h.start <= end && h.end >= start);
  const restrictionCount = w.employeeIds.filter(id => {
    const r = state.employeeRules[id];
    return r && summarizeExceptions(id).length > 0;
  }).length;

  const tempSchedule = { year: w.year, month: w.month, deptId: w.deptId, employeeIds: w.employeeIds, weeklyHours: w.weeklyHours, workWeekStart: w.workWeekStart, holidays };
  const conflicts = computeConflicts(state, tempSchedule);

  return `
    <h3>${t('ready_generate')}</h3>
    <div class="summary-grid">
      <div><b>${w.employeeIds.length}</b><span>${t('employees')}</span></div>

      <div><b>${holidays.length}</b><span>${t('holidays')}</span></div>

      ${holidays.length ? `<div><b>${t('holidays')}</b>${holidays.map(h=>`<div class="muted">${esc(h.name)} — ${h.start}–${h.end} (${staffingLabel(h.staffing)})</div>`).join('')}</div>` : ''}

  `;
}

const AVAIL_STATUSES = [
  { key: 'available', label: 'Available', color: '#E8ECF1' },
  { key: 'unavailable', label: 'Unavailable', color: '#F4C7C7' },
  { key: 'prefer_off', label: 'Prefer Off', color: '#FBE3B5' },
  { key: 'prefer_working', label: 'Prefer Working', color: '#C9EEE9' },
  { key: 'leave', label: 'Annual Leave', color: '#D6D0F0' },
];
function statusColor(k) { return (AVAIL_STATUSES.find(s=>s.key===k)||AVAIL_STATUSES[0]).color; }

function calendarEditor(empId, year, month) {
  const nDays = daysInMonth(year, month);
  const firstDow = dowOf(year, month, 1);
  let cells = '';
  for (let i=0;i<firstDow;i++) cells += `<div class="cal-cell cal-blank"></div>`;
  for (let d=1; d<=nDays; d++) {
    const dKey = dateKey(year, month, d);
    const status = getAvailability(state, empId, dKey);
    cells += `<div class="cal-cell" style="background:${statusColor(status)}" onclick="cycleAvail('${empId}','${dKey}')" title="${status}">
      <span>${d}</span>
    </div>`;
  }
  return `
    <div class="cal-legend">
      ${AVAIL_STATUSES.map(s=>`<span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${s.label}</span>`).join('')}
    </div>
    <div class="cal-grid">
      ${WEEKDAY_SHORT.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <p class="muted" style="margin-top:8px">Click a date to cycle its status.</p>
    <div class="recurring-row">
      <label>Recurring: prefer off every</label>
      <select onchange="setRecurring('${empId}', this.value)">
        <option value="">— choose a weekday —</option>
        ${WEEKDAY_NAMES.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}
      </select>
    </div>`;
}
function cycleAvail(empId, dKey) {
  const order = ['available','unavailable','prefer_off','prefer_working','leave'];
  const cur = getAvailability(state, empId, dKey);
  const next = order[(order.indexOf(cur)+1) % order.length];
  setAvailability(state, empId, dKey, next);
  saveState();
  if (ui.route === 'wizard') renderWizardStep();
  else render();
}
function setRecurring(empId, dow) {
  if (dow === '') return;
  if (!state.recurringOff[empId]) state.recurringOff[empId] = {};
  state.recurringOff[empId][Number(dow)] = 'prefer_off';
  saveState(); toast('Recurring preference saved');
  if (ui.route === 'wizard') renderWizardStep(); else render();
}

function runGenerate() {
  const w = ui.wizard;
  const start = dateKey(w.year, w.month, 1), end = dateKey(w.year, w.month, daysInMonth(w.year, w.month));
  const holidays = state.holidays.filter(h => h.deptId === w.deptId && h.start <= end && h.end >= start);
  const schedule = {
    id: uid('sch'), deptId: w.deptId, month: w.month, year: w.year, status: 'draft',
    rules: JSON.parse(JSON.stringify(w.rules)),
    weeklyHours: { ...w.weeklyHours }, workWeekStart: w.workWeekStart,
    holidays: JSON.parse(JSON.stringify(holidays)),
    employeeIds: w.employeeIds.slice(), days: {}, createdAt: Date.now(),
  };
  if (w.day1Assignments && Object.keys(w.day1Assignments).length) {
    const day1Key = dateKey(w.year, w.month, 1);
    schedule.days[day1Key] = { assignments: {}, locked: false, lockedShift: {} };
    Object.entries(w.day1Assignments).forEach(([shiftId, empIds]) => {
      if (empIds && empIds.length) schedule.days[day1Key].assignments[shiftId] = empIds.slice();
    });
  }
  generateSchedule(state, schedule, schedule.employeeIds);
  state.schedules.push(schedule);
  state.departmentDefaults[w.deptId] = {
    weeklyHours: { ...w.weeklyHours }, workWeekStart: w.workWeekStart, rules: JSON.parse(JSON.stringify(w.rules)),
  };
  ui.selectedScheduleId = schedule.id;
  ui.wizard = null;
  touchedScheduleId = schedule.id;
  saveState();
  toast('Schedule generated');
  go('schedule');
}

function navigateScheduleMonth(dir) {
  const s = state.schedules.find(x=>x.id===ui.selectedScheduleId);
  if (!s) return;
  let m = s.month + dir, y = s.year;
  if (m > 12) { m = 1; y++; } else if (m < 1) { m = 12; y--; }
  const target = state.schedules.find(x=>x.deptId===s.deptId && x.month===m && x.year===y);
  if (target) { ui.selectedScheduleId = target.id; render(); }
  else toast(`No schedule for ${MONTH_NAMES[m-1]} ${y} yet — create one from Schedules.`);
}
function lockEntireSchedule(id) {
  const s = state.schedules.find(x=>x.id===id);
  const shifts = state.shiftTypes.filter(sh=>sh.deptId===s.deptId);
  Object.values(s.days).forEach(day => {
    day.locked = true;
    day.lockedShift = day.lockedShift || {};
    shifts.forEach(sh => day.lockedShift[sh.id] = true);
  });
  saveState(); touchedScheduleId = id; toast('Entire schedule locked'); render();
}
function unpublishSchedule(id) { const s = state.schedules.find(x=>x.id===id); s.status='draft'; touchedScheduleId = id; saveState(); ui.moreMenuOpen=false; toast('Reverted to draft'); render(); }
function archiveSchedule(id) { const s = state.schedules.find(x=>x.id===id); s.status='archived'; touchedScheduleId = id; saveState(); ui.moreMenuOpen=false; toast('Schedule archived'); render(); }
function deleteScheduleConfirm(id) {
  if (!confirm('Delete this schedule permanently?')) return;
  state.schedules = state.schedules.filter(x=>x.id!==id);
  saveState(); deleteScheduleDoc(id); ui.moreMenuOpen=false; toast('Schedule deleted'); go('schedules');
}

          const weeks = computeWeeklyHours(state, s, id);
          if (!weeks.length) return '';
          return `<tr>
            <td style="white-space:nowrap"><b>${esc(emp?.name||'?')}</b></td>
            <td><div class="weekly-hours-grid">${weeks.map(w=>`<span class="wh-pill ${w.withinLimit?'':'wh-over'}">Week ${w.week}: ${w.hours}h${w.withinLimit?' ✓':' ⚠'}</span>`).join('')}</div></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function workloadTable(s) {
  const workload = computeWorkload(state, s, s.employeeIds);
  const rows = s.employeeIds.map(id => ({ id, name: state.employees.find(e=>e.id===id)?.name||'?', ...workload[id] }));
  rows.sort((a,b)=>b.shifts-a.shifts);
  const avgShifts = rows.reduce((a,r)=>a+r.shifts,0)/(rows.length||1);
  const showHoliday = (s.holidays||[]).length > 0;
  return `<div class="card table-card">
    <table class="table">
      <thead><tr><th>${t('employee')}</th><th>${t('total')}</th><th>${t('morning')}</th><th>${t('evening')}</th><th>${t('night')}</th><th>${t('weekend')}</th>${showHoliday?`<th>${t('holiday')}</th>`:''}<th>${t('hours')}</th><th>${t('avg_week')}</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td>${esc(r.name)}</td>
          <td>${r.shifts} ${r.shifts > avgShifts*1.3 ? '<span class="warn-badge">high</span>' : ''}</td>

function openAssignModal(dKey, shiftId) {
  const s = state.schedules.find(x=>x.id===ui.selectedScheduleId);
  const shift = state.shiftTypes.find(x=>x.id===shiftId);
  const day = s.days[dKey] || (s.days[dKey] = { assignments:{}, locked:false, lockedShift:{} });
  const assigned = day.assignments[shiftId] || [];
  const isShiftLocked = !!(day.lockedShift && day.lockedShift[shiftId]);
  const candidates = s.employeeIds
    .filter(id => !assigned.includes(id))
    .map(id => ({ id, name: state.employees.find(e=>e.id===id)?.name || '?', ...candidateStatus(state, s, dKey, shift, id) }))
    .sort((a,b)=> ({recommended:0,warning:1,unavailable:2})[a.status] - ({recommended:0,warning:1,unavailable:2})[b.status]);

  ui.modalHtml = `<div class="modal-backdrop" onclick="closeModalBg(event)">
    <div class="modal modal-wide">
      <h3>${esc(shift.name)} — ${fmtDate(dKey)}</h3>
      <p class="muted">${assigned.length}/${shift.required} ${t('assigned_count')}</p>
      <div class="assigned-list">
        ${assigned.length? assigned.map(id=>`<div class="assigned-row">
          <span>${esc(state.employees.find(e=>e.id===id)?.name||'?')}</span>
          <button class="link-btn link-danger" onclick="removeAssignment('${dKey}','${shiftId}','${id}')">${t('remove')}</button>
        </div>`).join('') : `<p class="muted">${t('no_one_assigned')}</p>`}
      </div>
      <div class="lock-row">
        <label class="check"><input type="checkbox" ${isShiftLocked?'checked':''} onchange="toggleShiftLock('${dKey}','${shiftId}', this.checked)"/> ${t('lock_shift_label')}</label>
      </div>
      <h4 style="margin-top:14px">${t('add_employee_hdr')}</h4>
      <div class="candidate-list">
        ${candidates.map(c=>`<div class="candidate-row ${c.status}">
          <div><b>${esc(c.name)}</b><div class="cand-reason">${esc(c.reason)}</div></div>
          <div class="btn-row">
            <span class="cand-badge cand-${c.status}">${t(c.status)}</span>
            ${c.status!=='unavailable'?`<button class="link-btn" onclick="addAssignment('${dKey}','${shiftId}','${c.id}')">${t('add')}</button>`:''}
          </div>
        </div>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">${t('close_btn')}</button>
      </div>
    </div></div>`;
  render();
}
function addAssignment(dKey, shiftId, empId) {
  const s = state.schedules.find(x=>x.id===ui.selectedScheduleId);
  const day = s.days[dKey];
  day.assignments[shiftId] = [...(day.assignments[shiftId]||[]), empId];
  s.issues = validateSchedule(state, s, state.employees.filter(e=>s.employeeIds.includes(e.id)), state.shiftTypes.filter(sh=>sh.deptId===s.deptId));
  touchedScheduleId = s.id; saveState(); openAssignModal(dKey, shiftId);
}
function removeAssignment(dKey, shiftId, empId) {
  const s = state.schedules.find(x=>x.id===ui.selectedScheduleId);
  const day = s.days[dKey];
  day.assignments[shiftId] = (day.assignments[shiftId]||[]).filter(id=>id!==empId);
  s.issues = validateSchedule(state, s, state.employees.filter(e=>s.employeeIds.includes(e.id)), state.shiftTypes.filter(sh=>sh.deptId===s.deptId));
  touchedScheduleId = s.id; saveState(); openAssignModal(dKey, shiftId);
}
function toggleShiftLock(dKey, shiftId, checked) {
  const s = state.schedules.find(x=>x.id===ui.selectedScheduleId);
  const day = s.days[dKey];
  day.lockedShift = day.lockedShift || {};
  day.lockedShift[shiftId] = checked;
  day.locked = Object.values(day.lockedShift).every(Boolean) && Object.keys(day.lockedShift).length===state.shiftTypes.filter(sh=>sh.deptId===s.deptId).length;
  touchedScheduleId = s.id; saveState();
}

function saveLeaveRecordModal(id) {
  const empId = document.getElementById('lv-emp').value;
  const type = document.getElementById('lv-type').value;
  const otherLabel = document.getElementById('lv-other').value.trim();
  const startD = document.getElementById('lv-start').value;
  const endD = document.getElementById('lv-end').value;
  const notes = document.getElementById('lv-notes').value.trim();
  const err = document.getElementById('leave-modal-error');
  if (!empId || !startD || !endD) { err.textContent = t('please_choose_emp_dates'); return; }
  if (endD < startD) { err.textContent = t('end_before_start'); return; }
  if (id) {
    const rec = state.leaveRecords.find(r=>r.id===id);
    applyLeaveRecord(state, rec, true); // reverse the old date range first
    Object.assign(rec, { empId, type, otherLabel, start: startD, end: endD, notes });
    applyLeaveRecord(state, rec, false);
  } else {
    const rec = { id: uid('leave'), empId, type, otherLabel, start: startD, end: endD, notes };
    state.leaveRecords.push(rec);
    applyLeaveRecord(state, rec, false);
  }
  closeModal(); saveState(); toast(t('save'));
  render();
}

      <table class="table">
        <thead><tr><th>${t('step_department')}</th><th>${t('department_head')}</th><th>${t('manager')}</th><th></th></tr></thead>
        <tbody>
          ${state.departments.map(d=>`<tr>
            <td>${esc(d.name)}</td>
            <td>${esc(d.headName||'—')}</td>
            <td>${esc(d.managerName||'—')}</td>
            <td class="row-actions">
              <button class="link-btn" onclick="ui.activeDeptId='${d.id}'; go('department')">${t('department_nav')}</button>
              <button class="link-btn" onclick="openDeptModal('${d.id}')">${t('edit')}</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <h3 class="section-title">${t('subscription_plan')}</h3>
    ${ui.subscriptionStatus ? `<div class="card" style="margin-bottom:10px"><b>${t('current_plan_status')}:</b> ${esc(ui.subscriptionStatus.status)} ${ui.subscriptionStatus.current_period_end?`· ${t('renews_on')} ${new Date(ui.subscriptionStatus.current_period_end).toLocaleDateString()}`:''}</div>` : ''}
    <div class="lang-toggle-compact" style="margin-bottom:10px">
      <button class="${ui.billingCycle==='monthly'?'active':''}" onclick="ui.billingCycle='monthly';render()">${t('billing_monthly')}</button>
      <button class="${ui.billingCycle==='yearly'?'active':''}" onclick="ui.billingCycle='yearly';render()">${t('billing_yearly')}</button>
    </div>
    <div class="card-grid">
      ${plans.map(([key,n,r,priceMonthly])=>{
        const price = ui.billingCycle==='yearly' ? (priceMonthly*10).toFixed(2) : priceMonthly.toFixed(2);
        return `<div class="card plan-card"><b>${n}</b><div class="muted">${r}</div><div class="plan-price">${price} SAR/${ui.billingCycle==='yearly'?t('year_short'):t('month_short')}</div>
          <button class="btn btn-primary btn-sm" style="margin-top:8px;width:100%" onclick="goToCheckout('${key}','${n}',${priceMonthly},'${ui.billingCycle}')">${t('subscribe_btn')}</button>
        </div>`;
      }).join('')}
      <div class="card plan-card"><b>Enterprise</b><div class="muted">100+ employees</div><div class="plan-price">${t('custom_pricing')}</div></div>
    </div>
    <p class="muted" style="font-size:11.5px;margin-top:8px">${t('apple_pay_note')}</p>

    <h3 class="section-title">${t('backup_hdr')}</h3>
    <p class="muted" style="margin-bottom:10px">${t('backup_sub')}</p>
    <div class="card">
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="downloadBackup()">${t('download_backup')}</button>
        <button class="btn btn-secondary" onclick="document.getElementById('restore-file-input').click()">${t('restore_backup')}</button>
      </div>
      <input type="file" id="restore-file-input" accept="application/json" style="display:none" onchange="restoreBackup(this.files[0])"/>
    </div>

    <h3 class="section-title">${t('security')}</h3>
    <div class="card">
      <button class="btn btn-ghost" onclick="authLogout()">${t('logout_btn')}</button>
    </div>
    <div class="card" style="margin-top:10px">
      <b>${t('bio_settings_title')}</b>
      <p class="muted" style="margin:4px 0 10px">${t('bio_settings_sub')}</p>
      ${biometricEnabled()
        ? `<button class="btn btn-ghost" onclick="toggleBiometricSetting(false)">${t('bio_disable')}</button>`
        : `<button class="btn btn-secondary" onclick="toggleBiometricSetting(true)">${t('bio_enable')}</button>`}
    </div>
  </div>`;
}
async function toggleBiometricSetting(enable) {
  if (enable) {
    const avail = await biometricAvailable();
    if (!avail) { toast(t('bio_not_available')); return; }
    const ok = await enableBiometric();
    if (ok) { toast(t('bio_enabled_toast')); render(); }
    else toast(t('bio_setup_failed'));
  } else {
    disableBiometric();
    toast(t('bio_disabled_toast'));
    render();
  }
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'schedule-rota-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function restoreBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!confirm(isRTL() ? 'استعادة هذا النسخ الاحتياطي بتستبدل كل البيانات الحالية. متأكد؟' : 'Restoring this backup will replace all current data. Are you sure?')) return;
      state = Object.assign(emptyState(), parsed);
      normalizeState();
      if (state.departments.length) ui.activeDeptId = state.departments[0].id;
      saveState();
      toast(isRTL() ? 'تم استعادة النسخة الاحتياطية' : 'Backup restored');
      go('dashboard');
    } catch (e) {
      alert(isRTL() ? 'تعذر قراءة ملف النسخة الاحتياطية' : 'Could not read backup file');
    }
  };
  reader.readAsText(file);
}

/* ---------------- PRINT / PDF VIEW ---------------- */
function openExportChoice(id) {
  ui.modalHtml = `<div class="modal-backdrop" onclick="closeModalBg(event)">
    <div class="modal">
      <h3>${t('choose_pdf_lang')}</h3>
      <div class="lang-choice" style="margin-top:10px">
        <button class="lang-option" onclick="closeModal(); openPrintView('${id}','en')"><b>English</b><span>Left to right</span></button>
        <button class="lang-option" onclick="closeModal(); openPrintView('${id}','ar')"><b>العربية</b><span>من اليمين لليسار</span></button>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button></div>
    </div></div>`;
  render();
}
function openPrintView(id, lang) {
  lang = lang || (isRTL() ? 'ar' : 'en');
  const rtl = lang === 'ar';
  const MN = rtl ? MONTH_NAMES_AR : MONTH_NAMES;
  const WN = rtl ? WEEKDAY_NAMES_AR : WEEKDAY_NAMES;
  const L = rtl ? {
    roster: 'جدول الدوام الشهري', date: 'التاريخ', day: 'اليوم',
    generatedOn: 'تاريخ الإنشاء', approved: 'معتمد', pending: 'بانتظار الاعتماد',
    preparedBy: 'إعداد', reviewedBy: 'مراجعة', approvedBy: 'اعتماد', signature: 'التوقيع والتاريخ',
  } : {
    roster: 'Monthly Duty Roster', date: 'Date', day: 'Day',
    generatedOn: 'Generated', approved: 'Approved', pending: 'Pending Approval',
    preparedBy: 'Prepared by', reviewedBy: 'Reviewed by', approvedBy: 'Approved by', signature: 'Signature & Date',
  };
  const s = state.schedules.find(x=>x.id===id);
  const dept = state.departments.find(d=>d.id===s.deptId);
  const staffGroups = state.staffGroups.filter(g=>g.deptId===s.deptId).sort((a,b)=>a.sortOrder-b.sortOrder);
  const shiftsByGroup = {};
  staffGroups.forEach(g => { shiftsByGroup[g.id] = state.shiftTypes.filter(sh=>sh.staffGroupId===g.id); });
  const visibleGroups = staffGroups.filter(g => shiftsByGroup[g.id].length > 0);
  const shifts = visibleGroups.reduce((arr,g)=>arr.concat(shiftsByGroup[g.id]), []);
  const nDays = daysInMonth(s.year, s.month);

  // dynamic page orientation: portrait comfortably fits ~6 assignment columns before it gets cramped
  const totalCols = 2 + shifts.length;
  const orientation = totalCols > 6 ? 'landscape' : 'portrait';
  const compactDays = nDays >= 30;

  let rows = '';
  for (let d=1; d<=nDays; d++) {
    const dKey = dateKey(s.year, s.month, d);
    const dow = new Date(dKey+'T00:00:00').getDay();
    const isWeekend = dow === 5 || dow === 6;
    const day = s.days[dKey] || { assignments:{} };
    const cells = shifts.map(sh => {
      const ids = day.assignments[sh.id] || [];
      const names = ids.map(id=>state.employees.find(e=>e.id===id)?.name||'').join(', ');
      return `<td>${names?`<b class="emp-name">${esc(names)}</b>`:''}</td>`;
    }).join('');
    rows += `<tr class="${isWeekend?'wknd':''}"><td>${d}/${s.month}/${s.year}</td><td>${WN[dow]}</td>${cells}</tr>`;
  }
  const area = document.getElementById('print-area');
  if (!area) { toast('Print area not found — please reload the page.'); return; }
  area.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  area.setAttribute('lang', lang);
  area.className = compactDays ? 'compact-days' : '';
  area.style.fontFamily = rtl ? "'Tajawal','Segoe UI',Tahoma,Arial,sans-serif" : "Arial, Helvetica, sans-serif";

  let pageStyleEl = document.getElementById('dynamic-page-style');
  if (!pageStyleEl) {
    pageStyleEl = document.createElement('style');
    pageStyleEl.id = 'dynamic-page-style';
    document.head.appendChild(pageStyleEl);
  }
  pageStyleEl.textContent = `@page { size: A4 ${orientation}; margin: 9mm; }`;

  const headRow = `<tr>
      <th class="daycol-th" rowspan="2">${L.date}</th><th class="daycol-th" rowspan="2">${L.day}</th>
      ${visibleGroups.map(g=>`<th class="grp-th" colspan="${shiftsByGroup[g.id].length}">${esc(g.displayName||g.name)}</th>`).join('')}
    </tr><tr>${visibleGroups.map(g=>shiftsByGroup[g.id].map(sh=>`<th class="shift-th"><span class="shift-th-name">${esc(sh.name)}</span><span class="shift-th-time">${sh.start}–${sh.end}</span></th>`).join('')).join('')}</tr>`;

  const statusBadge = s.status === 'published'
    ? `<span class="print-status-badge print-status-approved">✓ ${L.approved}</span>`
    : `<span class="print-status-badge print-status-pending">${L.pending}</span>`;

  const approvalRoles = [
    dept.officerName ? { label: L.preparedBy, name: dept.officerName, title: dept.officerTitle } : null,
    dept.managerName ? { label: L.reviewedBy, name: dept.managerName, title: dept.managerTitle } : null,
    dept.headName ? { label: L.approvedBy, name: dept.headName, title: dept.headTitle } : null,
  ].filter(Boolean);

  area.innerHTML = `
    <div class="print-head-row">
      <div>
        <div class="print-org-name">${esc(state.org.name)}</div>
        <div class="print-dept-name">${esc(dept.name)}</div>
        <div class="print-doc-title">${L.roster}</div>
      </div>
      <div>
        <div class="print-month">${MN[s.month-1]} ${s.year}</div>
        <div style="text-align:end">${statusBadge}</div>
      </div>
    </div>
    <table class="print-table"><thead>${headRow}</thead>
    <tbody>${rows}</tbody></table>
    ${approvalRoles.length ? `
    <div class="print-approvals">
      ${approvalRoles.map(a => `
        <div class="print-approval-block">
          <div class="print-approval-role">${a.label}</div>
          <div class="print-approval-line">${esc(a.name)}${a.title?` · ${esc(a.title)}`:''}</div>
        </div>`).join('')}
    </div>` : ''}
    <div class="print-foot"><span>${esc(state.org.name)}</span><span>${L.generatedOn} ${new Date().toLocaleDateString()}</span></div>`;
  // give the browser a tick to paint the print area before invoking the print dialog
  setTimeout(() => window.print(), 60);
}

document.addEventListener('DOMContentLoaded', () => {
  initApp();
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Schedule Rota — Smart Staff Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0B2540;
  --navy-2:#123252;
  --navy-3:#14375E;
  --teal:#0F9E97;
  --teal-deep:#0C7F79;
  --teal-soft:#E7F6F4;
  --ink:#16202B;
  --ink-soft:#5B6B7C;
  --surface:#FFFFFF;
  --surface-2:#F6F8FA;
  --border:#E3E8EE;
  --danger:#C6483C;
  --danger-soft:#FBEAE8;
  --warning:#B9821B;
  --radius:10px;
  --radius-lg:14px;
  --shadow:0 1px 2px rgba(11,37,64,.04), 0 4px 14px rgba(11,37,64,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink);
  background:var(--surface-2);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"] body{font-family:'Tajawal','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em;color:var(--navy)}
h1{font-size:22px}
h3.section-title{font-size:14px;font-weight:600;color:var(--navy);margin:22px 0 10px}
p{margin:0}
.muted{color:var(--ink-soft)}
a{color:var(--teal-deep)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:10px 0 5px}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
input[type=color]{padding:3px;height:38px}
textarea{resize:vertical}

/* ---- buttons ---- */
.btn{
  border:1px solid transparent;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;white-space:nowrap;
}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-secondary{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal-soft)}
.btn-secondary:hover{background:#DAF0EE}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-block{width:100%;margin-top:12px;text-align:center}
.btn-lg{padding:13px 16px;font-size:15px}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.link-btn{background:none;border:none;color:var(--teal-deep);font-weight:600;font-size:12.5px;cursor:pointer;padding:2px 4px}
.link-danger{color:var(--danger)}

/* ---- shell / nav ---- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:24px;padding:12px 22px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:8px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--navy);color:#fff;font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.brand-name{font-weight:700;color:var(--navy);font-size:15px}
.nav-desktop{display:flex;gap:2px;flex:1}
.navlink{background:none;border:none;padding:8px 12px;border-radius:7px;color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink.active{background:var(--teal-soft);color:var(--teal-deep)}
.org-chip{font-size:12.5px;color:var(--ink-soft);font-weight:600;padding:6px 12px;background:var(--surface-2);border-radius:20px}
.content{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:24px 22px 90px}
.nav-mobile{display:none}

/* ---- page layout ---- */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.empty-card{text-align:center;padding:40px 24px}
.empty-card h3{margin-bottom:6px}
.empty-card p{margin-bottom:16px}

/* ---- dept switcher ---- */
.dept-switch{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.chip-active{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip-add{color:var(--teal-deep);border-style:dashed}

/* ---- current schedule card ---- */
.current-schedule{cursor:pointer}
.cs-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.cs-dept{font-weight:700;color:var(--navy);font-size:15px}
.cs-month{color:var(--ink-soft);font-size:12.5px}
.cs-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cs-stats div{display:flex;flex-direction:column;gap:2px}
.cs-stats b{font-size:18px;color:var(--navy)}
.cs-stats span{font-size:11px;color:var(--ink-soft)}

.status-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:20px}
.status-draft{background:#FBEAD0;color:#8A5A0C}
.status-published{background:var(--teal-soft);color:var(--teal-deep)}
.status-archived{background:var(--surface-2);color:var(--ink-soft)}

.alert-list{margin:0;padding-left:18px}
.alert-list li{margin-bottom:8px;color:var(--ink)}
.simple-list{list-style:none;margin:0;padding:0}
.simple-list li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.simple-list li:last-child{border-bottom:none}

/* ---- tables ---- */
.table-card{padding:0;overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:11px 14px;background:var(--surface-2);color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.table td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:top}
.emp-name{font-weight:600}
.emp-sub{font-size:11.5px;color:var(--ink-soft)}
.row-actions{display:flex;gap:10px;white-space:nowrap}
.tag{display:inline-block;background:var(--teal-soft);color:var(--teal-deep);font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;margin-right:4px}

/* ---- forms/modals ---- */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,37,64,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-wide{max-width:620px}
.modal h3{margin-bottom:4px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.check{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink)}
[dir="rtl"] .check{justify-content:flex-end}
.radio{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500}
[dir="rtl"] .radio{justify-content:flex-end}

/* ---- onboarding ---- */
.onb-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--navy) 0%,var(--navy) 220px,var(--surface-2) 220px)}
.onb-card{background:#fff;border-radius:var(--radius-lg);padding:26px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2);margin:20px}
.onb-header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.onb-brand{display:flex;align-items:center;gap:9px}
.onb-tag{color:var(--ink-soft);font-size:13px;margin-bottom:14px}
.onb-card h2{font-size:18px;margin-bottom:4px}
.onb-card label{margin:8px 0 4px}
.bio-icon{font-size:40px;margin:14px 0}
.auth-error{color:var(--danger);font-size:12.5px;min-height:16px;margin-top:6px}

.auth-hero::before{
  content:'';position:absolute;inset:auto -20% -60% -20%;height:220px;
  background:radial-gradient(closest-side, rgba(15,158,151,.35), transparent 70%);
  border-radius:50%;pointer-events:none;
}
.auth-hero-top{display:flex;align-items:flex-start;justify-content:flex-end;gap:10px;position:relative;z-index:1}
.auth-hero-wordmark{font-size:29px;font-weight:800;letter-spacing:-.01em;margin:20px 0 6px;position:relative;z-index:1;color:#fff}
.auth-hero-wordmark span{color:#2FE6D6}
.auth-hero-tag{font-size:12.5px;color:rgba(255,255,255,.72);margin:0 0 20px;position:relative;z-index:1;max-width:280px}
.auth-hero-badges{display:flex;gap:10px;position:relative;z-index:1}
.auth-hero-badge{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:13px;padding:13px 4px}
.auth-hero-badge .icon{width:22px;height:22px;color:#2FE6D6}
.auth-hero-badge span{font-size:10.5px;color:rgba(255,255,255,.9);line-height:1.3;font-weight:500}
.auth-lang-pill{display:inline-flex;background:rgba(255,255,255,.14);border-radius:20px;padding:3px;gap:2px;flex-shrink:0}
.auth-lang-pill button{border:none;background:none;padding:5px 11px;border-radius:16px;cursor:pointer;color:rgba(255,255,255,.75);font-weight:600;font-size:11px;font-family:inherit}
.auth-lang-pill button.active{background:#fff;color:var(--navy)}

.auth-card-wrap{flex:1;margin-top:-91px;position:relative;z-index:2;padding:0 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.auth-card{background:#fff;border-radius:26px 26px 22px 22px;padding:26px 22px;width:100%;max-width:440px;box-shadow:0 24px 55px rgba(11,37,64,.22)}
.auth-card h2{font-size:19px;text-align:center;margin-bottom:4px}
.auth-card > p.muted{text-align:center;margin-bottom:16px}
.auth-field{position:relative;display:flex;align-items:center;border:1px solid rgba(11,37,64,.16);border-radius:12px;padding:0 12px;margin-bottom:10px;background:rgba(247,250,250,.6)}
.auth-field:focus-within{border-color:var(--teal);background:#fff}
.auth-field .icon{width:17px;height:17px;color:var(--ink-soft);flex-shrink:0}
.auth-field input{border:none;background:none;padding:11px 10px;font-size:14px;width:100%;color:var(--ink)}
.auth-field input::placeholder{color:#7C8896}
.auth-field input:focus{outline:none;box-shadow:none}
.auth-eye-btn{background:none;border:none;padding:4px;cursor:pointer;color:var(--ink-soft);display:flex;flex-shrink:0}
.auth-eye-btn .icon{width:17px;height:17px}
.auth-row-between{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin:6px 2px 4px}
.auth-row-between .check{font-size:12.5px}
.auth-row-between .check input[type="checkbox"]{accent-color:var(--teal-deep)}
.auth-row-between a{color:var(--teal-deep);font-weight:600;text-decoration:none}
.auth-cta{
  width:100%;margin-top:14px;border:none;border-radius:14px;padding:6px 8px 6px 20px;font-size:14.5px;font-weight:700;color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg, var(--navy), #0F6A66);box-shadow:0 10px 24px rgba(11,37,64,.28);min-height:52px;
}
[dir="rtl"] .auth-cta{padding:6px 20px 6px 8px}
.auth-cta-label{flex:1;text-align:center}
.auth-cta-arrow{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.auth-cta .icon{width:16px;height:16px}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-soft);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-secondary-cta{
  width:100%;border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:#fff;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:var(--ink-soft);
}

.leave-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.leave-row:last-child{border-bottom:none}

/* ---- employee exceptions ---- */
.exception-emp-list{display:flex;flex-direction:column;gap:10px}
.exception-row{border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.exception-row-top{display:flex;justify-content:space-between;align-items:center}
.exception-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ex-chip{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:3px 8px;font-size:11.5px;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.ex-chip a{color:var(--ink-soft);text-decoration:none;font-weight:700}

/* ---- review step ---- */
.review-summary{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.review-summary b{display:block;margin-bottom:4px;color:var(--navy);font-size:13px}

/* ---- weekly hours breakdown ---- */
.weekly-hours-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wh-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--teal-soft);color:var(--teal-deep)}
.wh-pill.wh-over{background:var(--danger-soft);color:var(--danger)}
.holiday-tag{font-size:10px;font-weight:700;color:#8A5A0C;background:#FBEAD0;padding:1px 6px;border-radius:8px;margin-left:6px}

/* ---- mobile roster cards (hidden on desktop) ---- */
.mobile-only-cards{display:none}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.day-card-head{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
.day-card-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:13px;cursor:pointer}
.day-card-row:first-of-type{border-top:none}
.dc-shift{font-weight:600;min-width:70px}
.dc-names{flex:1;color:var(--ink-soft)}

/* ================= RTL SUPPORT ================= */
[dir="rtl"] .table th,
[dir="rtl"] .avail-emp,
[dir="rtl"] .dropdown-menu button,
[dir="rtl"] .sblink{text-align:right}
[dir="rtl"] .dropdown-menu{right:auto;left:0}
[dir="rtl"] .toast{direction:rtl}
[dir="rtl"] .staff-info-item{border-right:none;border-left:1px solid var(--border)}
[dir="rtl"] .staff-info-item:last-child{border-left:none}
[dir="rtl"] .short-badge,[dir="rtl"] .warn-badge,[dir="rtl"] .holiday-tag{margin-left:0;margin-right:6px}
[dir="rtl"] .weekday-legend{margin-left:0;margin-right:auto}

/* ---- language choice ---- */
.lang-choice{display:flex;gap:10px;margin-top:6px}
.lang-option{flex:1;border:1px solid var(--border);border-radius:10px;padding:16px 10px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
.lang-option b{font-size:15px;color:var(--navy)}
.lang-option span{font-size:11px;color:var(--ink-soft)}
.lang-option.active,.lang-option:hover{border-color:var(--teal);background:var(--teal-soft)}
.lang-toggle-compact{display:inline-flex;border:1px solid var(--border);border-radius:20px;padding:2px;gap:1px;flex-shrink:0}
.lang-toggle-compact button{border:none;background:none;padding:5px 11px;border-radius:16px;cursor:pointer;color:var(--ink-soft);font-weight:600;font-size:11.5px;font-family:inherit}
.lang-toggle-compact button.active{background:var(--navy);color:#fff}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25)}

<script>
window.onerror = function(msg, url, line, col, err){

  if (el) {

      + '<button onclick="localStorage.clear();window.storage&&window.storage.set&&window.storage.set(\'schedulerota-data\',\'{}\').then(()=>location.reload());" style="margin-top:10px;padding:8px 14px;border-radius:8px;border:1px solid #C6483C;background:#fff;color:#C6483C;font-size:13px">Reset saved data and reload</button>'

};

<script>
/* ============================================================
   SCHEDULE ROTA — core app logic (v2: weekly hours, leave,
   public holidays, employee exceptions)
   ============================================================ */

/* ---------- Utilities ---------- */
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pad2 = n => String(n).padStart(2, '0');
const dateKey = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
const dateKeyFromDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
const dowOf = (y, m, d) => new Date(y, m - 1, d).getDay(); // 0=Sun..6=Sat
const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WEEKDAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAY_NAMES_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WEEKDAY_SHORT_AR = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const MONTH_NAMES_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function shiftDurationHours(shift) {
  let a = timeToMinutes(shift.start), b = timeToMinutes(shift.end);
  if (b <= a) b += 24 * 60; // overnight shift — never negative
  return (b - a) / 60;
}
function isNightShift(shift) {
  const startH = timeToMinutes(shift.start) / 60;
  return startH >= 19 || (shiftDurationHours(shift) > 0 && timeToMinutes(shift.end) <= timeToMinutes(shift.start) && startH >= 18);
}
function restHoursBetween(prevShift, prevDateKey, nextShift, nextDateKey) {
  const prevEnd = new Date(prevDateKey + 'T00:00:00');
  let endMin = timeToMinutes(prevShift.end);
  if (timeToMinutes(prevShift.end) <= timeToMinutes(prevShift.start)) endMin += 24 * 60;
  prevEnd.setMinutes(prevEnd.getMinutes() + endMin);

  const nextStart = new Date(nextDateKey + 'T00:00:00');
  nextStart.setMinutes(nextStart.getMinutes() + timeToMinutes(nextShift.start));

  return (nextStart - prevEnd) / (1000 * 60 * 60);
}

/* returns the date-key of the start of the calendar week containing dKey,
   given a configurable work-week start day (0=Sun..6=Sat) */
function weekAnchor(dKey, weekStart) {
  const d = new Date(dKey + 'T00:00:00');
  const diff = (d.getDay() - (weekStart || 0) + 7) % 7;
  d.setDate(d.getDate() - diff);
  return dateKeyFromDate(d);
}

/* which holiday (if any) covers this date, from a schedule's holiday list */
function holidayOn(schedule, dKey) {
  return (schedule.holidays || []).find(h => dKey >= h.start && dKey <= h.end) || null;
}

/* effective required headcount for a shift on a given date, after holiday staffing rules */
function effectiveRequired(shift, schedule, dKey) {
  return effectiveGroupRequired({ required: shift.required }, schedule, dKey);
}
function effectiveGroupRequired(group, schedule, dKey) {
  const h = holidayOn(schedule, dKey);
  if (!h) return group.required;
  if (h.staffing === 'off') return 0;
  if (h.staffing === 'reduced') return Math.max(group.required > 0 ? 1 : 0, Math.round(group.required * 0.5));
  return group.required;
}
function effectiveGroupMinimum(group, schedule, dKey) {
  const h = holidayOn(schedule, dKey);
  if (!h) return group.minimum || 0;
  if (h.staffing === 'off') return 0;
  if (h.staffing === 'reduced') return Math.round((group.minimum || 0) * 0.5);
  return group.minimum || 0;
}
function effectiveConsecutiveTarget(state, e) {
  const eRules = (state.employeeRules && state.employeeRules[e.id]) || {};
  if (eRules.consecutiveShiftTarget != null) return eRules.consecutiveShiftTarget;
  const group = (state.staffGroups || []).find(g => g.id === e.staffGroupId);
  if (group && group.distribution === 'consecutive' && group.targetShiftsPerEmployee != null) return group.targetShiftsPerEmployee;
  return null;
}
function groupTargetFor(state, e) {
  const group = (state.staffGroups || []).find(g => g.id === e.staffGroupId);
  return group ? group.targetShiftsPerEmployee : null;
}

/* ---------- Default data ---------- */
function defaultRules() {
  return {
    distributeFairly: true,
    respectUnavailable: true,
    respectLeave: true,
    balanceNights: true,
    balanceWeekends: true,
    balanceHolidays: true,
    avoidConsecutive: true,
    respectPreferOff: true,
    respectPreferWorking: true,
    minRestHours: 11,
    maxConsecutiveDays: 5,
    avoidMorningAfterNight: true,
  };
}
function defaultWeeklyHours() {
  return { limit: 48, type: 'hard' }; // type: 'hard' | 'soft'
}

function emptyState() {
  return {
    onboarded: false,
    org: { name: '', industry: '', workWeekStart: 0, language: 'en' }, // 0=Sunday
    departments: [],
    employees: [],
    staffGroups: [],          // { id, deptId, name, displayName, sortOrder, distribution, consecutiveDays, targetShiftsPerEmployee }
    shiftTypes: [],           // now owned by a staff group: { ..., staffGroupId, required, minimum }
    templates: [],
    availability: {},        // empId -> { 'YYYY-MM-DD': status }
    recurringOff: {},        // empId -> { dow: status }
    employeeRules: {},       // empId -> { see below }
    leaveRecords: [],        // { id, empId, type, otherLabel, start, end, notes }
    holidays: [],            // { id, deptId, name, start, end, staffing } — persistent, reused across schedules
    departmentDefaults: {},  // deptId -> { weeklyHours, workWeekStart, rules }
    schedules: [],
  };
}
/*
  staffGroups[i] shape:
  {
    id, deptId, name, displayName (schedule column name), sortOrder,
    distribution: 'consecutive' | 'separated' | 'flexible',
    consecutiveDays: number|null,       // used when distribution === 'consecutive'
    targetShiftsPerEmployee: number|null, // group default target; an employee's own targetShiftsOverride wins if set
  }
  employees now carry `staffGroupId` linking them to their group.
  shiftTypes now carry `staffGroupId` (which group owns this shift) + a simple `required`/`minimum`
  headcount — no more per-shift sub-groups, since the owning group already is the categorization.
*/
/*
  employeeRules[empId] shape:
  {
    maxShiftsOverride, minShiftsOverride, targetShiftsOverride, consecutiveShiftTarget,
    maxHoursOverride, weeklyHoursOverride: {limit, type},
    maxConsecutiveOverride,
    forbiddenWeekday: [0..6],
    mustWork: [{ date:'YYYY-MM-DD', shiftId: string|null }],
    forbiddenShiftTypes: [shiftTypeId],
    onlyShiftTypes: [shiftTypeId],
    shiftTypeLimits: { [shiftTypeId]: max },
    shiftTypeTargets: { [shiftTypeId]: target },
  }
*/

/* ---------- Availability (leave records sync into this) ---------- */
function getAvailability(state, empId, dKey) {
  const rec = state.availability[empId];
  if (rec && rec[dKey]) return rec[dKey];
  const rec2 = state.recurringOff[empId];
  if (rec2) {
    const dow = new Date(dKey + 'T00:00:00').getDay();
    if (rec2[dow]) return rec2[dow];
  }
  return 'available';
}
function setAvailability(state, empId, dKey, status) {
  if (!state.availability[empId]) state.availability[empId] = {};
  if (status === 'available') delete state.availability[empId][dKey];
  else state.availability[empId][dKey] = status;
}

/* apply/remove a leave record's date range onto the availability map */
function applyLeaveRecord(state, rec, remove) {
  let d = new Date(rec.start + 'T00:00:00');
  const end = new Date(rec.end + 'T00:00:00');
  while (d <= end) {
    const dKey = dateKeyFromDate(d);
    setAvailability(state, rec.empId, dKey, remove ? 'available' : 'leave');
    d.setDate(d.getDate() + 1);
  }
}

function leaveLabel(rec) {
  if (rec.type === 'other') return rec.otherLabel || 'Other Leave';
  return { annual: 'Annual Leave', sick: 'Sick Leave', study: 'Study Leave', emergency: 'Emergency Leave' }[rec.type] || rec.type;
}

/* ---------- Conflict detection (run before generation) ---------- */
function computeConflicts(state, schedule) {
  const conflicts = [];
  const empIds = schedule.employeeIds || [];

  empIds.forEach(empId => {
    const emp = state.employees.find(e => e.id === empId);
    if (!emp) return;
    const eRules = state.employeeRules[empId] || {};

    (eRules.mustWork || []).forEach(mw => {
      if (mw.date < scheduleStart(schedule) || mw.date > scheduleEnd(schedule)) return;
      const avail = getAvailability(state, empId, mw.date);
      if (avail === 'leave') {
        conflicts.push({ type: 'leave_vs_mustwork', empId, date: mw.date,
          message: `${emp.name} is on approved leave on ${mw.date} but is also marked as Must Work.` });
      }
      if (avail === 'unavailable') {
        conflicts.push({ type: 'unavailable_vs_mustwork', empId, date: mw.date,
          message: `${emp.name} is marked unavailable on ${mw.date} but is also marked as Must Work.` });
      }
    });

    const weeklyCfg = eRules.weeklyHoursOverride || schedule.weeklyHours || defaultWeeklyHours();
    if (weeklyCfg.type === 'hard' && (eRules.mustWork || []).length) {
      const byWeek = {};
      (eRules.mustWork || []).forEach(mw => {
        if (mw.date < scheduleStart(schedule) || mw.date > scheduleEnd(schedule)) return;
        const shift = mw.shiftId ? state.shiftTypes.find(s => s.id === mw.shiftId) : null;
        const hrs = shift ? shiftDurationHours(shift) : 8;
        const wk = weekAnchor(mw.date, schedule.workWeekStart || 0);
        byWeek[wk] = (byWeek[wk] || 0) + hrs;
      });
      Object.entries(byWeek).forEach(([wk, hrs]) => {
        if (hrs > weeklyCfg.limit) {
          conflicts.push({ type: 'hours_vs_mustwork', empId, week: wk,
            message: `${emp.name}'s mandatory assignments total ${Math.round(hrs)}h in the week of ${wk}, exceeding the ${weeklyCfg.limit}h hard limit.` });
        }
      });
    }
  });

  return conflicts;
}
function scheduleStart(schedule) { return dateKey(schedule.year, schedule.month, 1); }
function scheduleEnd(schedule) { return dateKey(schedule.year, schedule.month, daysInMonth(schedule.year, schedule.month)); }

/* ---------- Scheduling Engine ---------- */
function generateSchedule(state, schedule, employeeIds, options = {}) {
  const { month, year, deptId, rules } = schedule;
  schedule.weeklyHours = schedule.weeklyHours || defaultWeeklyHours();
  schedule.workWeekStart = schedule.workWeekStart ?? (state.org.workWeekStart || 0);
  schedule.holidays = schedule.holidays || [];

  const nDays = daysInMonth(year, month);
  const shiftTypes = state.shiftTypes.filter(s => s.deptId === deptId);
  const employees = state.employees.filter(e => employeeIds.includes(e.id));
  const empRoles = id => (state.employees.find(e => e.id === id)?.tags || []);
  const rulesOf = id => state.employeeRules[id] || {};

  if (!schedule.days) schedule.days = {};

  const counters = {};
  employees.forEach(e => counters[e.id] = {
    shifts: 0, hours: 0, nights: 0, weekends: 0, holidays: 0,
    lastWorkDateIdx: -99, consecutive: 0, history: [],
    byShiftType: {}, weeklyHours: {},
  });

  const dateKeys = [];
  for (let d = 1; d <= nDays; d++) dateKeys.push(dateKey(year, month, d));

  function recordAssignment(id, dKey, idx, shift, isWeekend, isHoliday) {
    const c = counters[id];
    c.shifts++; c.hours += shiftDurationHours(shift);
    if (isNightShift(shift)) c.nights++;
    if (isWeekend) c.weekends++;
    if (isHoliday) c.holidays++;
    c.byShiftType[shift.id] = (c.byShiftType[shift.id] || 0) + 1;
    const wk = weekAnchor(dKey, schedule.workWeekStart);
    c.weeklyHours[wk] = (c.weeklyHours[wk] || 0) + shiftDurationHours(shift);
    if (c.lastWorkDateIdx === idx - 1) c.consecutive++; else c.consecutive = 1;
    c.lastWorkDateIdx = idx;
    c.history.push({ idx, shiftId: shift.id });
  }

  dateKeys.forEach((dKey, idx) => {
    const day = schedule.days[dKey];
    if (!day) return;
    const dow = new Date(dKey + 'T00:00:00').getDay();
    const isWeekend = dow === 5 || dow === 6;
    const isHoliday = !!holidayOn(schedule, dKey);
    Object.entries(day.assignments || {}).forEach(([shiftId, empIdsList]) => {
      const shift = shiftTypes.find(s => s.id === shiftId);
      if (!shift) return;
      empIdsList.forEach(eid => { if (counters[eid]) recordAssignment(eid, dKey, idx, shift, isWeekend, isHoliday); });
    });
  });

  const issues = [];

  dateKeys.forEach((dKey, idx) => {
    const dow = new Date(dKey + 'T00:00:00').getDay();
    const isWeekend = dow === 5 || dow === 6;
    const holiday = holidayOn(schedule, dKey);
    const isHoliday = !!holiday;

    if (!schedule.days[dKey]) schedule.days[dKey] = { assignments: {}, locked: false, lockedShift: {} };
    const day = schedule.days[dKey];
    day.holiday = holiday ? { name: holiday.name, staffing: holiday.staffing } : null;

    const dayIsFrozen = options.onlyUnlocked ? day.locked : (options.restrictDates ? !options.restrictDates.has(dKey) : false);
    if (dayIsFrozen) return;

    day.assignments = day.assignments || {};

    shiftTypes.forEach(shift => {
      if (day.lockedShift && day.lockedShift[shift.id]) return;

      const required = effectiveGroupRequired({ required: shift.required }, schedule, dKey);
      const minimum = effectiveGroupMinimum({ minimum: shift.minimum || 0 }, schedule, dKey);
      const already = new Set(day.assignments[shift.id] || []);
      if (required <= 0 && already.size === 0) { day.assignments[shift.id] = []; return; }

      const workingToday = new Set();
      Object.values(day.assignments).forEach(list => list.forEach(id => workingToday.add(id)));

      function passesHardConstraints(e, forMustWork) {
        if (workingToday.has(e.id)) return false;
        if (e.staffGroupId !== shift.staffGroupId) return false; // only this shift's owning group may work it
        const avail = getAvailability(state, e.id, dKey);
        if (rules.respectLeave && avail === 'leave') return false;
        if (rules.respectUnavailable && avail === 'unavailable') return false;

        const eRules = rulesOf(e.id);
        const period = shift.period || 'morning';
        if (period === 'morning' && e.canMorning === false) return false;
        if (period === 'evening' && e.canEvening === false) return false;
        if (period === 'night' && e.canNight === false) return false;
        if (isWeekend && e.canWeekend === false) return false;
        if (eRules.forbiddenShiftTypes && eRules.forbiddenShiftTypes.includes(shift.id)) return false;
        if (eRules.onlyShiftTypes && eRules.onlyShiftTypes.length && !eRules.onlyShiftTypes.includes(shift.id)) return false;
        if (eRules.forbiddenWeekday && eRules.forbiddenWeekday.includes(dow)) return false;

        const c = counters[e.id];
        const maxShifts = eRules.maxShiftsOverride || e.maxShiftsPerMonth || 999;
        const maxHours = eRules.maxHoursOverride || e.maxHoursPerMonth || 9999;
        if (c.shifts + 1 > maxShifts) return false;
        const effConsecTarget = effectiveConsecutiveTarget(state, e);
        if (effConsecTarget != null && c.shifts >= effConsecTarget) return false;
        if (c.hours + shiftDurationHours(shift) > maxHours) return false;

        const shiftLimit = eRules.shiftTypeLimits && eRules.shiftTypeLimits[shift.id];
        if (shiftLimit != null && (c.byShiftType[shift.id] || 0) + 1 > shiftLimit) return false;

        const weeklyCfg = eRules.weeklyHoursOverride || schedule.weeklyHours;
        if (weeklyCfg && weeklyCfg.type === 'hard') {
          const wk = weekAnchor(dKey, schedule.workWeekStart);
          const projected = (c.weeklyHours[wk] || 0) + shiftDurationHours(shift);
          if (projected > weeklyCfg.limit && !forMustWork) return false;
        }

        const maxConsec = effConsecTarget != null
          ? Math.max(eRules.maxConsecutiveOverride || e.maxConsecutiveDays || rules.maxConsecutiveDays || 6, effConsecTarget)
          : (eRules.maxConsecutiveOverride || e.maxConsecutiveDays || rules.maxConsecutiveDays || 6);
        if (c.lastWorkDateIdx === idx - 1 && c.consecutive >= maxConsec) return false;

        const prevEntry = [...c.history].reverse().find(h => h.idx === idx - 1);
        if (prevEntry) {
          const prevShift = shiftTypes.find(s => s.id === prevEntry.shiftId);
          if (prevShift) {
            const buildingConsecutiveRun = effConsecTarget != null && c.shifts < effConsecTarget;
            const rest = restHoursBetween(prevShift, dateKeys[idx - 1], shift, dKey);
            if (rest < (rules.minRestHours || 11) && !buildingConsecutiveRun) return false;
            if (rules.avoidMorningAfterNight && shift.period === 'morning' && isNightShift(prevShift) && !buildingConsecutiveRun) return false;
          }
        }
        return true;
      }

      function scoreOf(e) {
        const c = counters[e.id];
        const eRules = rulesOf(e.id);
        let score = 0;
        if (rules.distributeFairly) score += c.shifts * 10;
        if (rules.balanceNights && isNightShift(shift)) score += c.nights * 15;
        if (rules.balanceWeekends && isWeekend) score += c.weekends * 12;
        if (rules.balanceHolidays && isHoliday) score += c.holidays * 25;
        if (rules.avoidConsecutive && c.lastWorkDateIdx === idx - 1) score += 8;
        const avail = getAvailability(state, e.id, dKey);
        if (rules.respectPreferOff && avail === 'prefer_off') score += 20;
        if (rules.respectPreferWorking && avail === 'prefer_working') score -= 20;

        const effTarget = eRules.targetShiftsOverride != null ? eRules.targetShiftsOverride : groupTargetFor(state, e);
        if (effTarget != null) score += (c.shifts - effTarget) * 6;
        const effConsecTarget = effectiveConsecutiveTarget(state, e);
        if (effConsecTarget != null && c.shifts < effConsecTarget) {
          if (c.lastWorkDateIdx === idx - 1) score -= 500; // mid-run: strongly prefer continuing the streak
          else if (c.shifts > 0) score += 50; // streak was broken before reaching the target — mildly discourage starting a new fragment
        }
        if (eRules.minShiftsOverride != null && c.shifts < eRules.minShiftsOverride) score -= 30;
        const shiftTarget = eRules.shiftTypeTargets && eRules.shiftTypeTargets[shift.id];
        if (shiftTarget != null) score += ((c.byShiftType[shift.id] || 0) - shiftTarget) * 8;

        const weeklyCfg = eRules.weeklyHoursOverride || schedule.weeklyHours;
        if (weeklyCfg && weeklyCfg.type === 'soft') {
          const wk = weekAnchor(dKey, schedule.workWeekStart);
          const projected = (c.weeklyHours[wk] || 0) + shiftDurationHours(shift);
          if (projected > weeklyCfg.limit) score += (projected - weeklyCfg.limit) * 4;
        }
        return score;
      }

      const picked = Array.from(already);

      // must-work placement
      employees.forEach(e => {
        if (e.staffGroupId !== shift.staffGroupId) return;
        const eRules = rulesOf(e.id);
        const mw = (eRules.mustWork || []).find(m => m.date === dKey && (m.shiftId === shift.id || !m.shiftId));
        if (!mw) return;
        if (workingToday.has(e.id) || already.has(e.id)) return;
        if (picked.length >= required) return;
        if (passesHardConstraints(e, true)) {
          picked.push(e.id);
          workingToday.add(e.id);
        } else {
          issues.push({ dateKey: dKey, shiftId: shift.id, shiftName: shift.name, type: 'mustwork_conflict', empId: e.id,
            message: `${e.name} was required to work but conflicts with a hard constraint (leave, rest, or eligibility).` });
        }
      });

      let need = required - picked.length;
      if (need > 0) {
        let candidates = employees.filter(e => !workingToday.has(e.id) && passesHardConstraints(e, false));
        candidates.sort((a, b) => scoreOf(a) - scoreOf(b));
        for (const e of candidates) {
          if (need <= 0) break;
          picked.push(e.id);
          workingToday.add(e.id);
          need--;
        }
      }

      if (picked.length < minimum) {
        issues.push({ dateKey: dKey, shiftId: shift.id, shiftName: shift.name, type: 'coverage_issue',
          message: `Coverage issue: only ${picked.length} of a required minimum ${minimum} staff available for "${shift.name}".` });
      } else if (picked.length < required) {
        issues.push({ dateKey: dKey, shiftId: shift.id, shiftName: shift.name, type: 'below_required',
          message: `Coverage below required staffing: ${picked.length} of ${required} filled for "${shift.name}".` });
      }

      picked.forEach(id => {
        if (already.has(id)) return;
        recordAssignment(id, dKey, idx, shift, isWeekend, isHoliday);
      });
      day.assignments[shift.id] = picked;
    });
  });

  schedule.issues = issues.concat(validateSchedule(state, schedule, employees, shiftTypes));
  return schedule;
}

/* ---------- Validation (run after generation or manual edit) ---------- */
function validateSchedule(state, schedule, employees, shiftTypes) {
  const issues = [];
  const weeklyDefault = schedule.weeklyHours || defaultWeeklyHours();
  const dateKeys = Object.keys(schedule.days).sort();
  const weeklyHoursByEmp = {};

  dateKeys.forEach(dKey => {
    const day = schedule.days[dKey];
    const workingToday = {};
    Object.entries(day.assignments || {}).forEach(([shiftId, empIds]) => {
      const shift = shiftTypes.find(s => s.id === shiftId);
      empIds.forEach(id => {
        workingToday[id] = (workingToday[id] || 0) + 1;
        const avail = getAvailability(state, id, dKey);
        if (avail === 'leave') {
          issues.push({ dateKey: dKey, shiftId, type: 'leave_conflict', message: `Employee is on annual leave.`, empId: id });
        } else if (avail === 'unavailable') {
          issues.push({ dateKey: dKey, shiftId, type: 'unavailable_conflict', message: `Employee marked unavailable.`, empId: id });
        }
        if (shift) {
          const wk = weekAnchor(dKey, schedule.workWeekStart || 0);
          weeklyHoursByEmp[id] = weeklyHoursByEmp[id] || {};
          weeklyHoursByEmp[id][wk] = (weeklyHoursByEmp[id][wk] || 0) + shiftDurationHours(shift);
        }
      });
    });
    Object.entries(workingToday).forEach(([id, count]) => {
      if (count > 1) issues.push({ dateKey: dKey, type: 'overlap', message: `Employee assigned to more than one shift on the same day.`, empId: id });
    });
  });

  Object.entries(weeklyHoursByEmp).forEach(([id, weeks]) => {
    const eRules = state.employeeRules[id] || {};
    const cfg = eRules.weeklyHoursOverride || weeklyDefault;
    Object.entries(weeks).forEach(([wk, hrs]) => {
      if (cfg.type === 'hard' && hrs > cfg.limit + 0.01) {
        issues.push({ dateKey: wk, type: 'weekly_hours_violation', empId: id, week: wk,
          message: `Weekly hours (${Math.round(hrs)}h) exceed the ${cfg.limit}h hard limit for the week of ${wk}.` });
      }
    });
  });

  return issues;
}

/* ---------- Weekly hours breakdown for display ---------- */
function computeWeeklyHours(state, schedule, empId) {
  const shiftTypes = state.shiftTypes.filter(s => s.deptId === schedule.deptId);
  const weeks = {};
  Object.entries(schedule.days || {}).forEach(([dKey, day]) => {
    Object.entries(day.assignments || {}).forEach(([shiftId, ids]) => {
      if (!ids.includes(empId)) return;
      const shift = shiftTypes.find(s => s.id === shiftId);
      if (!shift) return;
      const wk = weekAnchor(dKey, schedule.workWeekStart || 0);
      weeks[wk] = (weeks[wk] || 0) + shiftDurationHours(shift);
    });
  });
  const eRules = state.employeeRules[empId] || {};
  const cfg = eRules.weeklyHoursOverride || schedule.weeklyHours || defaultWeeklyHours();
  return Object.keys(weeks).sort().map((wk, i) => ({
    week: i + 1, weekStart: wk, hours: Math.round(weeks[wk] * 10) / 10,
    withinLimit: cfg.type !== 'hard' || weeks[wk] <= cfg.limit + 0.01,
    limit: cfg.limit,
  }));
}

/* ---------- Fairness & quality metrics ---------- */
function computeWorkload(state, schedule, employeeIds) {
  const shiftTypes = state.shiftTypes.filter(s => s.deptId === schedule.deptId);
  const rows = {};
  employeeIds.forEach(id => rows[id] = { shifts: 0, morning: 0, evening: 0, night: 0, weekend: 0, holiday: 0, hours: 0 });

  Object.entries(schedule.days || {}).forEach(([dKey, day]) => {
    const dow = new Date(dKey + 'T00:00:00').getDay();
    const isWeekend = dow === 5 || dow === 6;
    const isHoliday = !!day.holiday;
    Object.entries(day.assignments || {}).forEach(([shiftId, empIds]) => {
      const shift = shiftTypes.find(s => s.id === shiftId);
      if (!shift) return;
      empIds.forEach(id => {
        if (!rows[id]) return;
        rows[id].shifts++;
        rows[id].hours += shiftDurationHours(shift);
        if (isNightShift(shift)) rows[id].night++;
        else if (shift.period === 'evening') rows[id].evening++;
        else rows[id].morning++;
        if (isWeekend) rows[id].weekend++;
        if (isHoliday) rows[id].holiday++;
      });
    });
  });

  Object.keys(rows).forEach(id => {
    const wh = computeWeeklyHours(state, schedule, id);
    rows[id].avgWeeklyHours = wh.length ? Math.round((wh.reduce((a, w) => a + w.hours, 0) / wh.length) * 10) / 10 : 0;
    rows[id].weeklyBreakdown = wh;
  });

  return rows;
}

function stddev(arr) {
  if (!arr.length) return 0;
  const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
  const variance = arr.reduce((a, b) => a + (b - mean) ** 2, 0) / arr.length;
  return Math.sqrt(variance);
}

function computeFairnessScore(state, schedule, employeeIds) {
  const employees = state.employees.filter(e => employeeIds.includes(e.id));
  const workload = computeWorkload(state, schedule, employeeIds);
  const shiftsArr = employees.map(e => workload[e.id]?.shifts || 0);
  const nightsArr = employees.map(e => workload[e.id]?.night || 0);
  const weekendArr = employees.map(e => workload[e.id]?.weekend || 0);

  const meanShifts = shiftsArr.reduce((a, b) => a + b, 0) / (shiftsArr.length || 1);
  const shiftFairness = meanShifts > 0 ? clamp(1 - stddev(shiftsArr) / meanShifts, 0, 1) : 1;
  const meanNights = nightsArr.reduce((a, b) => a + b, 0) / (nightsArr.length || 1);
  const nightFairness = meanNights > 0 ? clamp(1 - stddev(nightsArr) / meanNights, 0, 1) : 1;
  const meanWeekend = weekendArr.reduce((a, b) => a + b, 0) / (weekendArr.length || 1);
  const weekendFairness = meanWeekend > 0 ? clamp(1 - stddev(weekendArr) / meanWeekend, 0, 1) : 1;

  const score = shiftFairness * 0.5 + nightFairness * 0.3 + weekendFairness * 0.2;
  return Math.round(score * 100);
}

function computeHolidayBalance(state, schedule, employeeIds) {
  if (!(schedule.holidays || []).length) return 100;
  const workload = computeWorkload(state, schedule, employeeIds);
  const arr = employeeIds.map(id => workload[id]?.holiday || 0);
  if (!arr.some(v => v > 0)) return 100;
  const mean = arr.reduce((a, b) => a + b, 0) / (arr.length || 1);
  return Math.round(clamp(1 - stddev(arr) / (mean || 1), 0, 1) * 100);
}

function computeCoverage(state, schedule) {
  const shiftTypes = state.shiftTypes.filter(s => s.deptId === schedule.deptId);
  let required = 0, filled = 0;
  Object.entries(schedule.days || {}).forEach(([dKey, day]) => {
    shiftTypes.forEach(shift => {
      const req = effectiveRequired(shift, schedule, dKey);
      required += req;
      filled += Math.min(req, (day.assignments[shift.id] || []).length);
    });
  });
  return required > 0 ? Math.round((filled / required) * 100) : 100;
}

function computeWeeklyHoursCompliance(state, schedule, employeeIds) {
  let total = 0, ok = 0;
  employeeIds.forEach(id => {
    computeWeeklyHours(state, schedule, id).forEach(w => { total++; if (w.withinLimit) ok++; });
  });
  return total > 0 ? Math.round((ok / total) * 100) : 100;
}

function computeLeaveCompliance(schedule) {
  const violations = (schedule.issues || []).filter(i => i.type === 'leave_conflict').length;
  return clamp(100 - violations * 20, 0, 100);
}

function computeQualityScore(state, schedule, employeeIds) {
  const coverage = computeCoverage(state, schedule);
  const fairness = computeFairnessScore(state, schedule, employeeIds);
  const weeklyHoursCompliance = computeWeeklyHoursCompliance(state, schedule, employeeIds);
  const leaveCompliance = computeLeaveCompliance(schedule);
  const holidayBalance = computeHolidayBalance(state, schedule, employeeIds);
  const hardIssues = (schedule.issues || []).filter(i => ['leave_conflict', 'unavailable_conflict', 'overlap', 'weekly_hours_violation'].includes(i.type)).length;
  const ruleCompliance = clamp(100 - hardIssues * 15, 0, 100);

  let preferHonored = 0, preferTotal = 0;
  Object.entries(schedule.days || {}).forEach(([dKey, day]) => {
    Object.values(day.assignments || {}).forEach(empIds => {
      empIds.forEach(id => {
        const avail = getAvailability(state, id, dKey);
        if (avail === 'prefer_working') { preferTotal++; preferHonored++; }
        if (avail === 'prefer_off') { preferTotal++; }
      });
    });
  });
  const preferenceScore = preferTotal > 0 ? Math.round((preferHonored / preferTotal) * 100) : 100;

  const overall = Math.round(
    coverage * 0.25 + fairness * 0.2 + weeklyHoursCompliance * 0.2 +
    leaveCompliance * 0.1 + ruleCompliance * 0.15 + preferenceScore * 0.1
  );
  let label = 'Needs attention';
  if (overall >= 95) label = 'Excellent';
  else if (overall >= 85) label = 'Good';
  else if (overall >= 70) label = 'Fair';

  return { overall, label, coverage, fairness, ruleCompliance, preferenceScore, weeklyHoursCompliance, leaveCompliance, holidayBalance };

function candidateStatus(state, schedule, dKey, shift, empId) {
  const e = state.employees.find(x => x.id === empId);
  if (!e) return { status: 'unavailable', reason: 'Unknown employee' };
  const day = schedule.days[dKey] || { assignments: {} };
  const workingToday = new Set();
  Object.values(day.assignments || {}).forEach(list => list.forEach(id => workingToday.add(id)));
  if (workingToday.has(empId)) return { status: 'unavailable', reason: 'Already assigned to another shift this day.' };

  const avail = getAvailability(state, empId, dKey);
  if (avail === 'leave') return { status: 'unavailable', reason: 'On approved leave.' };
  if (avail === 'unavailable') return { status: 'unavailable', reason: 'Marked unavailable / do-not-schedule this date.' };

  const eRules = state.employeeRules[empId] || {};
  const period = shift.period || 'morning';
  if (period === 'morning' && e.canMorning === false) return { status: 'unavailable', reason: 'Not eligible for morning shifts.' };
  if (period === 'evening' && e.canEvening === false) return { status: 'unavailable', reason: 'Not eligible for evening shifts.' };
  if (period === 'night' && e.canNight === false) return { status: 'unavailable', reason: 'Not eligible for night shifts.' };
  if (eRules.forbiddenShiftTypes && eRules.forbiddenShiftTypes.includes(shift.id)) return { status: 'unavailable', reason: 'Marked as cannot work this shift type.' };
  if (eRules.onlyShiftTypes && eRules.onlyShiftTypes.length && !eRules.onlyShiftTypes.includes(shift.id)) return { status: 'unavailable', reason: 'Restricted to other shift types only.' };

  const cfg = eRules.weeklyHoursOverride || schedule.weeklyHours || defaultWeeklyHours();
  const wk = weekAnchor(dKey, schedule.workWeekStart || 0);
  let weekHours = 0;
  Object.entries(schedule.days).forEach(([dk2, day2]) => {
    if (weekAnchor(dk2, schedule.workWeekStart || 0) !== wk) return;
    Object.entries(day2.assignments || {}).forEach(([sid, ids]) => {
      if (!ids.includes(empId)) return;
      const sh = state.shiftTypes.find(s => s.id === sid);
      if (sh) weekHours += shiftDurationHours(sh);
    });
  });
  const projected = weekHours + shiftDurationHours(shift);
  if (cfg.type === 'hard' && projected > cfg.limit) {
    return { status: 'unavailable', reason: `Would raise weekly hours to ${Math.round(projected)}h, over the ${cfg.limit}h hard limit.` };
  }

  const shiftTypes = state.shiftTypes.filter(s => s.deptId === schedule.deptId);
  const allDateKeys = Object.keys(schedule.days).sort();
  const idx = allDateKeys.indexOf(dKey);
  if (idx > 0) {
    const prevDay = schedule.days[allDateKeys[idx - 1]];
    for (const [sid, ids] of Object.entries(prevDay.assignments || {})) {
      if (ids.includes(empId)) {
        const prevShift = shiftTypes.find(s => s.id === sid);
        if (prevShift) {
          const rest = restHoursBetween(prevShift, allDateKeys[idx - 1], shift, dKey);
          if (rest < (schedule.rules.minRestHours || 11)) {
            return { status: 'warning', reason: `Worked ${prevShift.name} the day before — only ${Math.round(rest)}h rest.` };
          }
        }
      }
    }
  }
  if (cfg.type === 'soft' && projected > cfg.limit) {
    return { status: 'warning', reason: `Would raise weekly hours to ${Math.round(projected)}h, above the ${cfg.limit}h target.` };
  }
  if (avail === 'prefer_off') return { status: 'warning', reason: 'Prefers not to work this day.' };
  return { status: 'recommended', reason: 'No conflicts.' };
}

async function trySetNewPassword() {
  const pw = document.getElementById('reset-password').value;
  const confirmPw = document.getElementById('reset-confirm').value;
  const err = document.getElementById('auth-error');
  const _t = (key) => (I18N[authLang] && I18N[authLang][key]) || I18N.en[key] || key;
  if (pw.length < 6) { err.textContent = _t('auth_err_short6'); return; }
  if (pw !== confirmPw) { err.textContent = _t('auth_err_mismatch'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { err.textContent = error.message; return; }
  try { window.history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
  toast(_t('reset_success'));
  authUnlocked = true;
  await loadState();
}

async function authTrySignup() {
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-password').value;
  const confirmPw = document.getElementById('auth-confirm').value;
  const err = document.getElementById('auth-error');
  const info = document.getElementById('auth-info');
  const _t = (key) => (I18N[authLang] && I18N[authLang][key]) || I18N.en[key] || key;
  err.textContent = ''; info.textContent = '';
  if (!email) { err.textContent = _t('auth_err_email'); return; }
  if (pw.length < 6) { err.textContent = _t('auth_err_short6'); return; }
  if (pw !== confirmPw) { err.textContent = _t('auth_err_mismatch'); return; }
  rememberMeChoice = true; // new accounts default to staying signed in
  const { data, error } = await sb.auth.signUp({ email, password: pw });
  if (error) { err.textContent = error.message; return; }
  if (data && data.session && data.session.user) {
    currentUser = data.session.user;
    authUnlocked = true;
    await loadState();
  } else {
    info.textContent = _t('auth_check_email');
  }
}
async function authTryLogin() {
  const err = document.getElementById('auth-error');
  if (authBackend === 'supabase') {
    const email = document.getElementById('auth-email').value.trim();
    const pw = document.getElementById('auth-password').value;
    const rememberEl = document.getElementById('auth-remember');
    rememberMeChoice = rememberEl ? rememberEl.checked : true;
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { err.textContent = error.message; return; }
    currentUser = data.user;
    authUnlocked = true;
    await loadState();
    return;
  }
  // local-passcode fallback
  const pw = document.getElementById('auth-password').value;
  const _t = (key) => (I18N[authLang] && I18N[authLang][key]) || I18N.en[key] || key;
  const hash = await sha256Hex(pw);
  if (auth && hash === auth.passwordHash) {
    startSession();
    authUnlocked = true;
    await loadState();
  } else {
    err.textContent = _t('auth_err_wrong');
  }
}
async function authForgot() {
  const _t = (key) => (I18N[authLang] && I18N[authLang][key]) || I18N.en[key] || key;
  if (authBackend === 'supabase') {
    const email = document.getElementById('auth-email').value.trim();
    const err = document.getElementById('auth-error');
    const info = document.getElementById('auth-info');
    if (!email) { err.textContent = _t('auth_err_email'); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email);
    if (error) { err.textContent = error.message; return; }
    info.textContent = _t('auth_reset_sent');
    return;
  }
  if (!confirm(_t('auth_reset_confirm'))) return;
  auth = null;
  clearSession();
  try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
  renderAuthGate();
}
async function authTrySetup() {
  const username = document.getElementById('auth-username').value.trim();
  const pw = document.getElementById('auth-password').value;
  const confirmPw = document.getElementById('auth-confirm').value;
  const err = document.getElementById('auth-error');
  const _t = (key) => (I18N[authLang] && I18N[authLang][key]) || I18N.en[key] || key;
  if (!username) { err.textContent = _t('auth_err_username'); return; }
  if (pw.length < 4) { err.textContent = _t('auth_err_short'); return; }
  if (pw !== confirmPw) { err.textContent = _t('auth_err_mismatch'); return; }
  const passwordHash = await sha256Hex(pw);
  auth = { username, passwordHash };
  saveAuth(auth);
  startSession();
  authUnlocked = true;
  await loadState();
}
async function authLogout() {
  if (authBackend === 'supabase' && sb) { try { await sb.auth.signOut(); } catch (e) {} currentUser = null; }
  clearSession();
  authUnlocked = false;
  renderAuthGate();
}

/* ---------------- Billing / Moyasar subscriptions ---------------- */
function goToCheckout(planKey, planLabel, priceSar, cycle) {
  if (authBackend !== 'supabase' || !currentUser) {
    toast(isRTL() ? 'سجل دخول أول عشان تشترك' : 'Please sign in before subscribing');
    return;
  }
  const amountSar = cycle === 'yearly' ? priceSar * 10 : priceSar;
  const amountHalalas = Math.round(amountSar * 100);
  const params = new URLSearchParams({
    plan: planKey, label: planLabel, cycle, userId: currentUser.id,
    email: currentUser.email || '', amount: String(amountHalalas),
  });
  window.location.href = '/checkout.html?' + params.toString();
}
async function loadSubscriptionStatus() {
  if (authBackend !== 'supabase' || !sb || !currentUser) return;
  try {
    const { data, error } = await sb.from('subscriptions').select('status,plan,cycle,current_period_end').eq('user_id', currentUser.id).maybeSingle();
    if (!error && data) ui.subscriptionStatus = data;
  } catch (e) { /* best-effort — billing status is informational only */ }
}
function handleCheckoutRedirect() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('checkout');
  if (status === 'success') { toast(isRTL() ? 'تم الاشتراك بنجاح 🎉' : 'Subscribed successfully 🎉'); loadSubscriptionStatus(); }
  else if (status === 'cancelled') { toast(isRTL() ? 'تم إلغاء عملية الدفع' : 'Checkout was cancelled'); }
  if (status) window.history.replaceState({}, '', window.location.pathname);
}

/* backfills fields that may be missing from state saved by an older version of the app,
   so opening a schedule/data created before a feature existed never crashes the UI. */
function normalizeState() {
  if (!state.org) state.org = { name:'', industry:'', workWeekStart:0, language:'en' };
  if (state.org.workWeekStart == null) state.org.workWeekStart = 0;
  if (!state.org.language) state.org.language = 'en';
  state.departments = state.departments || [];
  state.employees = state.employees || [];
  state.shiftTypes = state.shiftTypes || [];
  state.templates = state.templates || [];
  state.availability = state.availability || {};
  state.recurringOff = state.recurringOff || {};
  state.employeeRules = state.employeeRules || {};
  state.leaveRecords = state.leaveRecords || [];
  state.holidays = state.holidays || [];
  state.departmentDefaults = state.departmentDefaults || {};
  state.schedules = (state.schedules || []).map(s => {
    s.weeklyHours = s.weeklyHours || defaultWeeklyHours();
    if (s.weeklyHours.limit == null) s.weeklyHours.limit = 48;
    if (!s.weeklyHours.type) s.weeklyHours.type = 'hard';
    if (s.workWeekStart == null) s.workWeekStart = 0;
    s.holidays = s.holidays || [];
    s.employeeIds = s.employeeIds || [];
    s.days = s.days || {};
    s.issues = s.issues || [];
    s.rules = s.rules || defaultRules();
    s.status = s.status || 'draft';
    Object.values(s.days).forEach(day => {
      day.assignments = day.assignments || {};
      day.lockedShift = day.lockedShift || {};
      if (day.locked == null) day.locked = false;
    });
    return s;
  });
  state.departments.forEach(d => {
    d.status = d.status || 'active';
    if (!('headName' in d)) d.headName = '';
    if (!('managerName' in d)) d.managerName = '';
    if (!('officerName' in d)) d.officerName = '';
  });
  state.staffGroups = state.staffGroups || [];
  state.staffGroups.forEach(g => {
    if (g.sortOrder == null) g.sortOrder = 0;
    if (!g.displayName) g.displayName = g.name;
    if (!g.distribution) g.distribution = 'flexible';
    if (g.consecutiveDays === undefined) g.consecutiveDays = null;
    if (g.targetShiftsPerEmployee === undefined) g.targetShiftsPerEmployee = null;
  });
  state.employees.forEach(e => {
    e.status = e.status || 'active';
    e.tags = e.tags || [];
    if (e.maxShiftsPerMonth == null) e.maxShiftsPerMonth = 20;
    if (e.maxHoursPerMonth == null) e.maxHoursPerMonth = 200;
    if (e.maxConsecutiveDays == null) e.maxConsecutiveDays = 5;
  });

  // ---- migrate to the group-owns-shifts model, department by department ----
  state.departments.forEach(dept => {
    const unmigratedShifts = state.shiftTypes.filter(s => s.deptId === dept.id && !s.staffGroupId);
    if (!unmigratedShifts.length) return; // this department is already fully migrated (or has no shifts yet)
    const groupsByTag = {};
    let order = state.staffGroups.filter(g => g.deptId === dept.id).length;
    function getOrCreateGroup(tag) {
      const key = tag || '__general__';
      if (groupsByTag[key]) return groupsByTag[key];
      let g = state.staffGroups.find(x => x.deptId === dept.id && x.name === (tag || (isRTL()?'عام':'General')));
      if (!g) {
        g = { id: uid('sgrp'), deptId: dept.id, name: tag || (isRTL()?'عام':'General'), displayName: tag || (isRTL()?'عام':'General'),
          sortOrder: order++, distribution: 'flexible', consecutiveDays: null, targetShiftsPerEmployee: null };
        state.staffGroups.push(g);
      }
      groupsByTag[key] = g;
      return g;
    }
    const newShifts = [];
    unmigratedShifts.forEach(shift => {
      const subGroups = (shift.staffGroups && shift.staffGroups.length) ? shift.staffGroups : [{ tag: null, required: shift.required || 1, minimum: 0 }];
      const multi = subGroups.length > 1;
      subGroups.forEach(sg => {
        const group = getOrCreateGroup(sg.tag);
        newShifts.push({
          id: uid('shift'), deptId: dept.id, staffGroupId: group.id,
          name: shift.name + (multi ? ` (${sg.tag || (isRTL()?'عام':'General')})` : ''),
          start: shift.start, end: shift.end, period: shift.period, color: shift.color,
          required: sg.required, minimum: sg.minimum || 0,
        });
      });
    });
    state.shiftTypes = state.shiftTypes.filter(s => s.deptId !== dept.id || s.staffGroupId).concat(newShifts);
    state.employees.filter(e => e.deptId === dept.id && !e.staffGroupId).forEach(e => {
      const tag = (e.tags && e.tags[0]) || null;
      const group = groupsByTag[tag] || getOrCreateGroup(tag);
      e.staffGroupId = group.id;
    });
  });
  state.shiftTypes.forEach(s => {
    if (s.required == null) s.required = 1;
    if (s.minimum == null) s.minimum = 0;
  });
}

/* Persistence layers, tried in order:
   1. Supabase `app_data` table, scoped to the signed-in user via RLS — real cross-device sync.
   2. window.storage, when running inside a Claude.ai artifact preview.
   3. Real browser localStorage — always available as a local cache/fallback, including
      when Supabase is unreachable (offline) or not configured. */
async function storageGet(key) {
  if (authBackend === 'supabase' && sb && currentUser) {
    try {
      const { data, error } = await sb.from('app_data').select('data').eq('user_id', currentUser.id).maybeSingle();
      if (!error && data && data.data) return { value: JSON.stringify(data.data) };
    } catch (e) { /* fall through */ }
  }
  if (window.storage && window.storage.get) {
    try {
      const res = await window.storage.get(key);
      if (res && res.value) return res;
    } catch (e) { /* fall through to localStorage */ }
  }
  try {
    const v = localStorage.getItem(key);
    return v ? { value: v } : null;
  } catch (e) { return null; }
}
async function storageSet(key, value) {
  let ok = false;
  if (authBackend === 'supabase' && sb && currentUser) {
    try {
      const parsed = JSON.parse(value);
      const { error } = await sb.from('app_data').upsert({ user_id: currentUser.id, data: parsed });
      if (!error) ok = true;
    } catch (e) { /* fall through, still mirror locally below */ }
  }
  if (window.storage && window.storage.set) {
    try { await window.storage.set(key, value); ok = true; } catch (e) { /* ignore, still try localStorage */ }
  }
  try { localStorage.setItem(key, value); ok = true; } catch (e) { /* ignore */ }
  return ok;
}

/* ---- document-based Supabase persistence: 'core' (org/departments/employees/
   shifts/rules/leave/holidays) + one 'schedule:<id>' document per schedule, so
   editing one thing never rewrites the whole account's history. ---- */
async function loadStateFromSupabaseDocs() {
  const { data, error } = await sb.from('app_documents').select('doc_key,data').eq('user_id', currentUser.id);
  if (error || !data || !data.length) return null;
  let core = null;
  const schedules = [];
  data.forEach(row => {
    if (row.doc_key === 'core') core = row.data;
    else if (row.doc_key && row.doc_key.indexOf('schedule:') === 0) schedules.push(row.data);
  });
  if (!core) return null;
  return Object.assign({}, core, { schedules });
}
async function saveStateToSupabaseDocs() {
  const coreDoc = Object.assign({}, state);
  delete coreDoc.schedules;
  const rows = [{ user_id: currentUser.id, doc_key: 'core', data: coreDoc }];
  if (touchedScheduleId) {
    const touched = state.schedules.find(s => s.id === touchedScheduleId);
    if (touched) rows.push({ user_id: currentUser.id, doc_key: 'schedule:' + touched.id, data: touched });
    touchedScheduleId = null;
  }
  const { error } = await sb.from('app_documents').upsert(rows);
  if (error) throw error;
}
async function deleteScheduleDoc(id) {
  if (authBackend === 'supabase' && sb && currentUser) {
    try { await sb.from('app_documents').delete().eq('user_id', currentUser.id).eq('doc_key', 'schedule:' + id); }
    catch (e) { /* best-effort — local delete already happened */ }
  }
}

async function loadState() {
  try {
    if (authBackend === 'supabase' && sb && currentUser) {
      const merged = await loadStateFromSupabaseDocs();
      if (merged) {
        state = Object.assign(emptyState(), merged);
      } else {
        // migration path: an older single-blob `app_data` row may still exist from
        // before the document split — read it once, then re-save in the new shape.
        try {
          const { data, error } = await sb.from('app_data').select('data').eq('user_id', currentUser.id).maybeSingle();
          if (!error && data && data.data) state = Object.assign(emptyState(), data.data);
        } catch (e) { /* no legacy blob either — brand new account */ }
      }
    } else {
      const res = await storageGet(STORAGE_KEY);
      if (res && res.value) state = Object.assign(emptyState(), JSON.parse(res.value));
    }
  } catch (e) { /* no saved data yet */ }
  try {
    normalizeState();
  } catch (e) { console.error('normalizeState failed', e); }
  if (state.departments.length) ui.activeDeptId = state.departments[0].id;
  try {
    render();
  } catch (e) {
    if (window.onerror) window.onerror(e.message, '', 0, 0, e);
    else console.error(e);
  }
  try { handleCheckoutRedirect(); loadSubscriptionStatus(); } catch (e) { /* billing status is best-effort */ }
}

let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (authBackend === 'supabase' && sb && currentUser) {
      try { await saveStateToSupabaseDocs(); }
      catch (e) { console.error('supabase save failed', e); }
    }
    // always mirror locally too, as an offline-friendly cache / local-backend store
    try { await storageSet(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { console.error('local save failed', e); }
  }, 250);
}

          <span class="sb-avatar">${(state.org.name||'S').charAt(0)}</span>
          <div><div class="sb-profile-name">${esc(dept?.headName || state.org.name || 'Manager')}</div><div class="sb-profile-role">${esc(dept?.headTitle || t('department_head'))}</div></div>

        ${mobNavLink('dashboard', 'home', t('home'))}
        ${mobNavLink('schedules', 'calendar', t('schedules'))}
        ${mobNavLink('employees', 'users', t('team'))}
        ${mobNavLink('reports', 'chart', t('reports'))}
        ${mobNavLink('settings', 'settings', t('more'))}
      </nav>
    </div>
    <div id="toast"></div>
    ${ui.modalHtml || ''}
  </div>`;
}
function sbLink(route, iconName, label) {
  return `<button class="sblink ${ui.route===route?'active':''}" onclick="${route==='wizard'?'startWizard()':`go('${route}')`}">${icon(iconName)}<span>${label}</span></button>`;
}
function mobNavLink(route, iconName, label) { return `<button class="mnavlink ${ui.route===route?'active':''}" onclick="go('${route}')">${icon(iconName)}<span>${label}</span></button>`; }

function routeView(dept) {
  switch (ui.route) {
    case 'dashboard': return dashboardView(dept);
    case 'employees': return employeesView(dept);
    case 'shifts': return shiftsView(dept);
    case 'schedules': return schedulesListView(dept);
    case 'wizard': return wizardView(dept);
    case 'schedule': return scheduleView();
    case 'department': return departmentView(dept);
    case 'leave': return leaveStandaloneView(dept);
    case 'holidays': return holidaysStandaloneView(dept);
    case 'exceptions': return exceptionsStandaloneView(dept);
    case 'reports': return reportsView(dept);
    case 'settings': return settingsView();
    default: return dashboardView(dept);
  }
}

      canMorning: true, canEvening: true, canNight: true, canWeekend: true,
    });

    { id: uid('shift'), deptId, staffGroupId: residentsGroup.id, name: isRTL()?'الفترة الصباحية':'Day Shift',

  ui.activeDeptId = deptId;

  const names = onbData.employeesRaw.split('\n').map(s => s.trim()).filter(Boolean);
  names.forEach(name => {
    state.employees.push({
      id: uid('emp'), name, deptId, tags: [], status: 'active',
      maxShiftsPerMonth: 20, maxHoursPerMonth: 200, maxConsecutiveDays: 5,
      canMorning: true, canEvening: true, canNight: true, canWeekend: true,
    });
  });

  // sensible default shift types so the department isn't empty
  ['Morning|07:00|15:00|morning','Evening|15:00|23:00|evening','Night|23:00|07:00|night'].forEach(row => {
    const [name, start, end, period] = row.split('|');

  state.onboarded = true;
  saveState();
  render();

/* ---------------- DASHBOARD ---------------- */
function dashboardView(dept) {
  if (!dept) return emptyDeptPrompt();
  const schedules = state.schedules.filter(s => s.deptId === dept.id).sort((a,b)=> (b.year-a.year)|| (b.month-a.month));
  const current = schedules[0];
  const empCount = state.employees.filter(e => e.deptId === dept.id && e.status !== 'inactive').length;
  const shiftCount = state.shiftTypes.filter(s => s.deptId === dept.id).length;
  const leaveCount = state.leaveRecords.filter(l => state.employees.some(e=>e.id===l.empId && e.deptId===dept.id)).length;

  // target month for the hero prompt: next month without a generated schedule yet, else current month
  const now = new Date();
  let targetMonth = now.getMonth()+1, targetYear = now.getFullYear();
  if (schedules.some(s=>s.month===targetMonth && s.year===targetYear)) {
    targetMonth++; if (targetMonth>12) { targetMonth=1; targetYear++; }
  }

  let avgWeeklyHours = 0;
  if (current) {
    const emps = state.employees.filter(e=>(current.employeeIds||[]).includes(e.id));
    if (emps.length) {
      const workload = computeWorkload(state, current, emps.map(e=>e.id));
      const totalHours = emps.reduce((sum,e)=> sum + (workload[e.id] ? workload[e.id].hours : 0), 0);
      const weeks = daysInMonth(current.year, current.month) / 7;
      avgWeeklyHours = Math.round(totalHours / emps.length / weeks);
    }
  }

  const steps = [
    { done: true, title: t('cl_step1_t'), sub: t('cl_step1_s') },
    { done: empCount > 0, title: t('cl_step2_t'), sub: t('cl_step2_s') },
    { done: shiftCount > 0, title: t('cl_step3_t'), sub: t('cl_step3_s') },
    { done: leaveCount > 0, title: t('cl_step4_t'), sub: t('cl_step4_s') },
    { done: schedules.length > 0, title: t('cl_step5_t'), sub: t('cl_step5_s') },
  ];
  const doneCount = steps.filter(s=>s.done).length;
  const nextStepIdx = steps.findIndex(s=>!s.done);

  const alerts = [];
  if (current) {
    const hard = (current.issues||[]).filter(i=>['leave_conflict','unavailable_conflict','overlap','coverage_issue','below_required'].includes(i.type));
    if (hard.length) alerts.push(isRTL() ? `${hard.length} مشكلة جدولة تحتاج انتباه.` : `${hard.length} scheduling issue${hard.length>1?'s':''} need${hard.length>1?'':'s'} attention.`);
  }
  if (!schedules.some(s => s.month === targetMonth && s.year === targetYear)) {
    alerts.push(isRTL() ? 'لم يتم توليد جدول الشهر القادم بعد.' : `Next month's schedule hasn't been generated yet.`);
  }
  if (!empCount) alerts.push(isRTL() ? `لا يوجد موظفون مضافون بعد في ${esc(dept.name)}.` : `No employees added yet in ${esc(dept.name)}.`);

  const monthNames = localMonthNames();
  const dowShort = localWeekdayShort();
  const calDays = Array.from({length:21}).map((_,i)=>i);

  return `
  <div class="page dash-page">
    <div class="dash-hero">
      <div class="dash-hero-top">
        <button class="dash-dept-pill" onclick="ui.deptSwitcherOpen=!ui.deptSwitcherOpen; render()">
          <span>${esc(state.org.name||'')}</span>
          <b>${esc(dept.name)} ${icon('chevronDown')}</b>
        </button>
        <div class="dash-hero-icons">
          <span class="dash-bell">${icon('bell')}</span>
          <span class="dash-avatar">${esc((state.org.name||'?').charAt(0).toUpperCase())}</span>
        </div>
      </div>
      ${ui.deptSwitcherOpen ? deptSwitcher() : ''}
      <div class="dash-hero-body">
        <div class="dash-hero-text">
          <h1>${t('good_'+greetingTime())} 👋</h1>
          <p class="dash-hero-q">${isRTL() ? `جاهز لإنشاء جدول ${monthNames[targetMonth-1]}؟` : `Ready to create ${monthNames[targetMonth-1]}'s schedule?`}</p>
          <p class="dash-hero-sub">${t('dash_hero_sub')}</p>
          <button class="dash-hero-cta" onclick="startWizard()">${t('create_new_schedule')}</button>
        </div>
        <div class="dash-cal-illust">
          <div class="dash-cal-head"><span>${monthNames[targetMonth-1].slice(0,3).toUpperCase()}</span><b>${targetYear}</b></div>
          <div class="dash-cal-grid">
            ${dowShort.map(d=>`<span class="dash-cal-dow">${d.slice(0,1)}</span>`).join('')}
            ${calDays.map(i=>`<span class="dash-cal-cell ${i===11?'active':''}"></span>`).join('')}
          </div>
        </div>
      </div>
      <p class="dash-hero-tag">${t('dash_hero_tagline')}</p>
    </div>

    <div class="dash-stats-row">
      <div class="dash-stat dash-stat-green">${icon('users')}<b>${empCount}</b><span>${t('dash_stat_members')}</span></div>
      <div class="dash-stat dash-stat-blue">${icon('clock')}<b>${avgWeeklyHours}</b><span>${t('dash_stat_hours')}</span></div>
      <div class="dash-stat dash-stat-purple">${icon('building')}<b>${esc(dept.name)}</b><span>${t('dash_stat_dept')}</span></div>
    </div>

    ${doneCount < 5 ? `
    <div class="card dash-checklist">
      <div class="dash-checklist-head">
        <h3>${t('cl_title')}</h3>
        <span class="muted">${doneCount} ${isRTL()?'من 5 مكتملة':'of 5 completed'}</span>
      </div>
      <p class="muted" style="margin:2px 0 10px">${t('cl_sub')}</p>
      <div class="dash-progress"><div class="dash-progress-fill" style="width:${doneCount/5*100}%"></div></div>
      <div class="dash-steps">
        ${steps.map((s,i)=>`
          <div class="dash-step ${s.done?'done':''} ${i===nextStepIdx?'next':''}">
            <span class="dash-step-dot">${s.done?icon('check'):(i+1)}</span>
            <div><b>${s.title}</b><div class="muted">${s.sub}</div></div>
          </div>`).join('')}
      </div>
      <button class="dash-hero-cta dash-start-btn" onclick="startWizard()">✨ ${t('cl_start_btn')}</button>
    </div>` : ''}

    ${ui.dashTipDismissed ? '' : `
    <div class="card dash-tip">
      <span class="dash-tip-icon">💡</span>
      <div><b>${t('dash_tip_title')}</b><p class="muted">${t('dash_tip_text')}</p></div>
      <button class="dash-tip-close" onclick="ui.dashTipDismissed=true; render()">✕</button>
    </div>`}

    <div class="grid-2">
      <div>
        <h3 class="section-title">${t('current_schedule')}</h3>
        ${current ? `
        <div class="card current-schedule" onclick="openSchedule('${current.id}')">
          <div class="cs-top">
            <div>
              <div class="cs-dept">${esc(dept.name)}</div>
              <div class="cs-month">${monthNames[current.month-1]} ${current.year}</div>
            </div>
            <span class="status-pill status-${current.status}">${current.status}</span>
          </div>
          <div class="cs-stats">
            <div><b>${(current.employeeIds||[]).length}</b><span>${t('employees')}</span></div>
            <div><b>${daysInMonth(current.year, current.month)}</b><span>${t('day')}s</span></div>
            <div><b>${computeCoverage(state, current)}%</b><span>${t('coverage')}</span></div>
            <div><b>${computeFairnessScore(state, current, current.employeeIds||[])}%</b><span>${t('fairness')}</span></div>
          </div>
        </div>` : `
        <div class="card empty-card">
          <h3>${t('no_schedules_dept')} ${esc(dept.name)}</h3>
          <p class="muted">${t('create_first')}</p>
          <button class="btn btn-primary" onclick="startWizard()">${t('create_new_schedule')}</button>
        </div>`}
      </div>
      <div>
        <h3 class="section-title">${t('needs_attention')}</h3>
        <div class="card">
          ${alerts.length ? `<ul class="alert-list">${alerts.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>` : `<p class="muted">${t('all_clear')}</p>`}
        </div>
        <h3 class="section-title" style="margin-top:20px">${t('recent_schedules')}</h3>
        <div class="card">
          ${schedules.length ? `<ul class="simple-list">${schedules.slice(0,5).map(s=>`
            <li onclick="openSchedule('${s.id}')">
              <span>${monthNames[s.month-1]} ${s.year}</span>
              <span class="status-pill status-${s.status}">${s.status}</span>
            </li>`).join('')}</ul>` : `<p class="muted">No schedules yet.</p>`}
        </div>
      </div>
    </div>
  </div>`;
}
function greetingTime() { const h = new Date().getHours(); return h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'; }
function emptyDeptPrompt() {
  return `<div class="page"><div class="card empty-card">
    <h3>${isRTL()?'أنشئ قسمًا للبدء':'Create a department to get started'}</h3>
    <p class="muted">${isRTL()?'الأقسام تنظم الموظفين والورديات والجداول.':'Departments keep employees, shifts, and schedules organized.'}</p>
    <button class="btn btn-primary" onclick="openDeptModal()">${isRTL()?'+ إضافة قسم':'+ Add Department'}</button>
  </div></div>`;
}
function deptSwitcher() {
  if (state.departments.length < 2) return '';
  return `<div class="dept-switch">
    ${state.departments.map(d=>`<button class="chip ${ui.activeDeptId===d.id?'chip-active':''}" onclick="ui.activeDeptId='${d.id}'; render()">${esc(d.name)}</button>`).join('')}
    <button class="chip chip-add" onclick="openDeptModal()">${isRTL()?'+ قسم':'+ Department'}</button>
  </div>`;
}

function saveDept(id) {
  const name = document.getElementById('m-dept-name').value.trim();

  const data = {
    name, description: document.getElementById('m-dept-desc').value.trim(),
    headName: document.getElementById('m-dept-headname').value.trim(),
    headTitle: document.getElementById('m-dept-headtitle').value.trim(),
    managerName: document.getElementById('m-dept-managername').value.trim(),
    managerTitle: document.getElementById('m-dept-managertitle').value.trim(),
    officerName: document.getElementById('m-dept-officername').value.trim(),
    officerTitle: document.getElementById('m-dept-officertitle').value.trim(),
  };
  if (id) {
    Object.assign(state.departments.find(x=>x.id===id), data);
    closeModal(); saveState(); toast(t('department_updated')); render();
    return;
  }
  const newId = uid('dept');
  state.departments.push({ id: newId, status: 'active', ...data });
  ui.activeDeptId = newId;
  ['Morning|07:00|15:00|morning','Evening|15:00|23:00|evening','Night|23:00|07:00|night'].forEach(row => {
    const [n, start, end, period] = row.split('|');
    state.shiftTypes.push({ id: uid('shift'), deptId: newId, name: n, start, end, period, required: 1, color: period==='night'?'#14375E':(period==='evening'?'#0F9E97':'#5B6B7C'), roleRequirements: [] });
  });
  closeModal(); saveState(); toast(t('department_created')); go('dashboard');
}
function closeModal() { ui.modalHtml = ''; render(); }
function closeModalBg(e) { if (e.target.classList.contains('modal-backdrop')) closeModal(); }

/* ---------------- EMPLOYEES ---------------- */

  const ungrouped = state.employees.filter(e=>e.deptId===dept.id && !groups.some(g=>g.id===e.staffGroupId));
  const totalEmps = state.employees.filter(e=>e.deptId===dept.id).length;
  return `
  <div class="page">
    <div class="page-head">
      <div><h1>${t('employees')}</h1><p class="muted">${esc(dept.name)} · ${totalEmps} ${t('team_members')}${(!isRTL() && totalEmps!==1)?'s':''}</p></div>

        <button class="btn btn-secondary" onclick="openBulkAdd()">${t('bulk_add')}</button>
        <button class="btn btn-primary" onclick="openStaffGroupModal()">${t('add_staff_group_btn')}</button>
      </div>
    </div>
